<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Web - Optimized</title>
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace, "Malgun Gothic", sans-serif;
      background: #000;
    }

    canvas { display: block; }

    #lobby {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #7ec0ee 0%, #9bd0ff 45%, #7bc96f 46%, #5ea84a 100%);
      z-index: 100;
      color: white;
    }

    .lobby-screen {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .title-wrap {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      user-select: none;
    }

    .title {
      font-size: 86px;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d9d3d0;
      text-shadow:
        0 6px 0 #4b4747,
        -4px -4px 0 #000,
        4px -4px 0 #000,
        -4px 4px 0 #000,
        4px 4px 0 #000,
        0 -4px 0 #000,
        0 4px 0 #000,
        -4px 0 0 #000,
        4px 0 0 #000;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 34px;
      font-weight: 800;
      color: #d9d3d0;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        0 3px 0 #000;
    }

    .splash {
      position: absolute;
      right: -120px;
      top: 40px;
      transform: rotate(-18deg);
      font-size: 28px;
      font-weight: 900;
      color: #ffe600;
      text-shadow:
        -2px -2px 0 #4c4c00,
        2px -2px 0 #4c4c00,
        -2px 2px 0 #4c4c00,
        2px 2px 0 #4c4c00;
      white-space: nowrap;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -42%);
      width: 760px;
      max-width: calc(100% - 40px);
    }

    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }

    .mc-btn {
      width: 100%;
      height: 72px;
      border: 4px solid #1b1b1b;
      background: linear-gradient(to bottom, #bdbdbd 0%, #a9a9a9 49%, #8d8d8d 50%, #9a9a9a 100%);
      color: #f2f2f2;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.35),
        inset 0 -3px 0 rgba(0,0,0,0.25),
        0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.05s ease, filter 0.08s ease;
    }

    .mc-btn:hover { filter: brightness(1.08); }
    .mc-btn:active { transform: translateY(2px); }

    .mc-btn.realms {
      position: relative;
      padding-right: 80px;
    }

    .mc-btn.realms::after {
      content: "◆";
      position: absolute;
      right: 26px;
      top: 50%;
      transform: translateY(-50%);
      color: #1de9b6;
      font-size: 30px;
    }

    .bottom-left,
    .bottom-right {
      position: absolute;
      bottom: 16px;
      font-size: 18px;
      font-weight: 700;
      text-shadow:
        -2px -2px 0 rgba(0,0,0,0.6),
        2px -2px 0 rgba(0,0,0,0.6),
        -2px 2px 0 rgba(0,0,0,0.6),
        2px 2px 0 rgba(0,0,0,0.6);
    }

    .bottom-left { left: 16px; }
    .bottom-right { right: 16px; }

    .panel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 20;
    }

    .panel.show { display: flex; }

    .dialog {
      width: 560px;
      max-width: calc(100% - 24px);
      background: #2e2e2e;
      border: 4px solid #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 22px;
    }

    .dialog-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 14px;
      color: white;
    }

    .dialog-text {
      font-size: 18px;
      line-height: 1.5;
      color: #e6e6e6;
      margin-bottom: 18px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
    }

    .small-btn {
      height: 56px;
      font-size: 20px;
    }

    #gameRoot {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      border: 2px solid white;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      bottom: 10px;
      width: 250px;
      color: white;
      font-family: 'Malgun Gothic', sans-serif;
      background: rgba(0,0,0,0.82);
      padding: 15px;
      border-radius: 8px;
      overflow-y: auto;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    #ui::-webkit-scrollbar { width: 6px; }
    #ui::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

    .inv-item {
      margin-top: 4px;
      padding: 6px;
      border-radius: 4px;
      font-size: 0.85em;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .inv-item:hover { background: rgba(255,255,255,0.1); }

    .active {
      background: rgba(0,255,0,0.15);
      border: 1px solid #00ff00;
      color: #00ff00;
      font-weight: bold;
    }

    .category {
      margin-top: 15px;
      color: #ffeb3b;
      font-weight: bold;
      font-size: 0.9em;
      border-bottom: 1px solid #555;
      padding-bottom: 3px;
    }

    .block-count { color: #aaa; }
    .active .block-count { color: #00ff00; }

    #pauseHint {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 10px;
      border-radius: 6px;
    }

    @media (max-width: 900px) {
      .title { font-size: 58px; }
      .subtitle { font-size: 24px; }
      .splash { font-size: 18px; right: -70px; top: 28px; }
      .menu { width: calc(100% - 24px); transform: translate(-50%, -36%); }
      .mc-btn { height: 64px; font-size: 22px; }
    }

    @media (max-width: 640px) {
      .menu-row { grid-template-columns: 1fr; }
      .title { font-size: 42px; }
      .subtitle { font-size: 18px; }
      .splash { display: none; }
    }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="lobby-screen">
      <div class="title-wrap">
        <div class="title">MINECRAFT</div>
        <div class="subtitle">JAVA EDITION</div>
        <div class="splash">Tree World!</div>
      </div>

      <div class="menu">
        <div class="menu-stack">
          <button class="mc-btn" id="singleBtn">싱글플레이</button>
          <button class="mc-btn" id="multiBtn">멀티플레이</button>
          <button class="mc-btn realms" id="realmsBtn">Minecraft Realms</button>

          <div class="menu-row">
            <button class="mc-btn" id="settingsBtn">설정...</button>
            <button class="mc-btn" id="quitBtn">게임 종료</button>
          </div>
        </div>
      </div>

      <div class="bottom-left">Minecraft 26.1</div>
      <div class="bottom-right">Optimized Tree Prototype</div>

      <div class="panel" id="modal">
        <div class="dialog">
          <div class="dialog-title" id="modalTitle">안내</div>
          <div class="dialog-text" id="modalText">내용</div>
          <div class="dialog-actions">
            <button class="mc-btn small-btn" id="confirmBtn">확인</button>
            <button class="mc-btn small-btn" id="cancelBtn">닫기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="gameRoot">
    <div id="crosshair"></div>
    <div id="ui">
      <div style="font-weight:bold; font-size:1.1em; margin-bottom:5px; text-align:center;">⛏️ 인벤토리</div>
      <div style="font-size:0.8em; color:#aaa; text-align:center; margin-bottom:10px;">[1~0] 키로 선택</div>
      <div id="inventory-list"></div>
      <hr style="margin:12px 0; border-color:#444;">
      <div id="perfInfo" style="font-size:12px; color:#9fdcff; line-height:1.5;"></div>
    </div>
    <div id="pauseHint">ESC: 메인 화면으로 / 클릭: 마우스 고정</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    // ---------------------------
    // UI / Modal
    // ---------------------------
    const lobby = document.getElementById('lobby');
    const gameRoot = document.getElementById('gameRoot');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const confirmBtn = document.getElementById('confirmBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const perfInfo = document.getElementById('perfInfo');

    let confirmAction = null;

    function openModal(title, text, onConfirm = null) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      confirmAction = onConfirm;
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
      confirmAction = null;
    }

    confirmBtn.addEventListener('click', () => {
      if (confirmAction) confirmAction();
      closeModal();
    });

    cancelBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('multiBtn').addEventListener('click', () => {
      openModal('멀티플레이', '이번 버전은 싱글플레이 테스트용이다.');
    });

    document.getElementById('realmsBtn').addEventListener('click', () => {
      openModal('Minecraft Realms', 'Realms는 나중에 붙이면 된다.');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      openModal('설정', '설정 메뉴는 다음 단계에서 붙이면 된다.');
    });

    document.getElementById('quitBtn').addEventListener('click', () => {
      openModal('게임 종료', '브라우저에서는 탭을 닫으면 된다.');
    });

    // ---------------------------
    // Three.js
    // ---------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 40, 160);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);

    document.addEventListener('click', () => {
      if (gameStarted && !controls.isLocked && lobby.style.display === 'none') {
        controls.lock();
      }
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.78));

    const sun = new THREE.DirectionalLight(0xffffff, 0.7);
    sun.position.set(50, 80, 30);
    scene.add(sun);

    // ---------------------------
    // Config
    // ---------------------------
    const CHUNK_SIZE = 16;
    const RENDER_DISTANCE = 2;
    const WORLD_BOTTOM = -32;
    const WORLD_TOP_BUFFER = 8;

    const PLAYER_WIDTH = 0.6;
    const PLAYER_HALF = PLAYER_WIDTH / 2;
    const PLAYER_HEIGHT = 1.8;
    const PLAYER_EYE_HEIGHT = 1.62;
    const STEP_HEIGHT = 0.6;
    const EPS = 0.001;

    const TREE_CHANCE = 0.045; // 나무 생성 확률(4.5%)
    const raycaster = new THREE.Raycaster();
    const dummy = new THREE.Object3D();

    const BLOCK_DATA = {
      grass:     { name: "잔디 블록", color: 0x4caf50, cat: "자연", key: "1" },
      dirt:      { name: "흙",        color: 0x7a4f2a, cat: "자연", key: "2" },
      stone:     { name: "돌",        color: 0x8a8a8a, cat: "자연", key: "3" },
      deepslate: { name: "심층암",    color: 0x444444, cat: "자연", key: "4" },
      sand:      { name: "모래",      color: 0xd7c37a, cat: "자연", key: "5" },
      log:       { name: "원목",      color: 0x6f4e37, cat: "나무", key: "6" },
      leaves:    { name: "나뭇잎",    color: 0x2e7d32, cat: "나무", key: "7" },
      coal:      { name: "석탄 광석", color: 0x2c2c2c, cat: "광석", key: "8" },
      iron:      { name: "철 광석",   color: 0xb0b0b0, cat: "광석", key: "9" },
      diamond:   { name: "다이아",    color: 0x3ee7ff, cat: "광석", key: "0" }
    };

    const BLOCK_TYPES = Object.keys(BLOCK_DATA);

    const materials = {};
    for (const type of BLOCK_TYPES) {
      materials[type] = new THREE.MeshLambertMaterial({ color: BLOCK_DATA[type].color });
    }

    const boxGeo = new THREE.BoxGeometry(1, 1, 1);

    // ---------------------------
    // Inventory
    // ---------------------------
    let inventory = {};
    let selectedBlockType = "grass";
    for (const type of BLOCK_TYPES) inventory[type] = 20;

    function updateUI() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';
      let lastCat = '';

      for (const type of BLOCK_TYPES) {
        const data = BLOCK_DATA[type];

        if (data.cat !== lastCat) {
          const catDiv = document.createElement('div');
          catDiv.className = 'category';
          catDiv.innerText = data.cat;
          list.appendChild(catDiv);
          lastCat = data.cat;
        }

        const div = document.createElement('div');
        div.className = `inv-item ${selectedBlockType === type ? 'active' : ''}`;
        div.innerHTML = `<span>[${data.key}] ${data.name}</span><span class="block-count">${inventory[type]}</span>`;
        div.onclick = () => {
          selectedBlockType = type;
          updateUI();
        };
        list.appendChild(div);
      }
    }

    updateUI();

    // ---------------------------
    // World data
    // ---------------------------
    const chunks = new Map();
    const modifiedBlocks = new Map();

    let currentChunkX = null;
    let currentChunkZ = null;
    let gameStarted = false;

    function blockKey(x, y, z) {
      return `${x},${y},${z}`;
    }

    function chunkKey(cx, cz) {
      return `${cx},${cz}`;
    }

    function floorDiv(n, size) {
      return Math.floor(n / size);
    }

    // ---------------------------
    // Noise / terrain
    // ---------------------------
    function hash2D(x, z) {
      let h = x * 374761393 + z * 668265263;
      h = (h ^ (h >> 13)) * 1274126177;
      return ((h ^ (h >> 16)) >>> 0) / 4294967295;
    }

    function hash3D(x, y, z) {
      let h = x * 374761393 + y * 1274126177 + z * 668265263;
      h = (h ^ (h >> 13)) * 1274126177;
      return ((h ^ (h >> 16)) >>> 0) / 4294967295;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function valueNoise(x, z) {
      const x0 = Math.floor(x);
      const z0 = Math.floor(z);
      const x1 = x0 + 1;
      const z1 = z0 + 1;

      const sx = smoothstep(x - x0);
      const sz = smoothstep(z - z0);

      const n00 = hash2D(x0, z0);
      const n10 = hash2D(x1, z0);
      const n01 = hash2D(x0, z1);
      const n11 = hash2D(x1, z1);

      const ix0 = lerp(n00, n10, sx);
      const ix1 = lerp(n01, n11, sx);

      return lerp(ix0, ix1, sz) * 2 - 1;
    }

    function fbm(x, z) {
      let total = 0;
      let amplitude = 1;
      let frequency = 1;
      let maxValue = 0;

      for (let i = 0; i < 4; i++) {
        total += valueNoise(x * frequency, z * frequency) * amplitude;
        maxValue += amplitude;
        amplitude *= 0.5;
        frequency *= 2;
      }
      return total / maxValue;
    }

    function getTerrainHeight(x, z) {
      const n1 = fbm(x * 0.03, z * 0.03);
      const n2 = fbm(x * 0.008, z * 0.008);
      const hill = n1 * 6;
      const continent = n2 * 8;
      return Math.floor(continent + hill + 10);
    }

    function isTreeBase(x, z) {
      const surfaceY = getTerrainHeight(x, z);
      if (surfaceY < 7) return false;

      const r = hash2D(x * 31 + 7, z * 17 + 13);
      return r < TREE_CHANCE;
    }

    function getTerrainBlockType(x, y, z) {
      const h = getTerrainHeight(x, z);
      if (y > h) return null;

      if (y === h) return 'grass';
      if (y >= h - 3) return 'dirt';

      if (y < -10) {
        const r = hash3D(x * 7, y * 13, z * 11);
        if (r < 0.008 && y < -18) return 'diamond';
        if (r < 0.02 && y < -14) return 'iron';
        if (r < 0.05) return 'coal';
        return 'deepslate';
      }

      if (h <= 4 && y >= h - 1) return 'sand';

      return 'stone';
    }

    function getDecorativeBlockType(x, y, z) {
      // 근처 5x5 범위의 나무를 확인
      for (let ox = -2; ox <= 2; ox++) {
        for (let oz = -2; oz <= 2; oz++) {
          const tx = x - ox;
          const tz = z - oz;

          if (!isTreeBase(tx, tz)) continue;

          const treeBaseY = getTerrainHeight(tx, tz);
          const trunkHeight = 4 + Math.floor(hash2D(tx * 19, tz * 23) * 3); // 4~6
          const topY = treeBaseY + trunkHeight;

          // trunk
          if (x === tx && z === tz) {
            if (y >= treeBaseY + 1 && y <= topY) {
              return 'log';
            }
          }

          // leaves
          const leafBottom = topY - 2;
          const leafTop = topY + 1;

          if (y >= leafBottom && y <= leafTop) {
            const radius = (y === leafTop) ? 1 : 2;
            const dx = x - tx;
            const dz = z - tz;

            if (Math.abs(dx) <= radius && Math.abs(dz) <= radius) {
              // 줄기 자리 비우기
              if (!(dx === 0 && dz === 0 && y <= topY)) {
                // 모서리 일부 제거
                if (!(Math.abs(dx) === radius && Math.abs(dz) === radius && y !== leafTop)) {
                  return 'leaves';
                }
              }
            }
          }
        }
      }

      return null;
    }

    function getBlockTypeAt(x, y, z) {
      const key = blockKey(x, y, z);
      if (modifiedBlocks.has(key)) return modifiedBlocks.get(key);

      const deco = getDecorativeBlockType(x, y, z);
      if (deco) return deco;

      return getTerrainBlockType(x, y, z);
    }

    function isSolidBlockAt(x, y, z) {
      return getBlockTypeAt(x, y, z) !== null;
    }

    function isBlockVisible(x, y, z) {
      return (
        !isSolidBlockAt(x + 1, y, z) ||
        !isSolidBlockAt(x - 1, y, z) ||
        !isSolidBlockAt(x, y + 1, z) ||
        !isSolidBlockAt(x, y - 1, z) ||
        !isSolidBlockAt(x, y, z + 1) ||
        !isSolidBlockAt(x, y, z - 1)
      );
    }

    // ---------------------------
    // Chunk build
    // ---------------------------
    function createChunk(cx, cz) {
      return {
        cx,
        cz,
        group: new THREE.Group(),
        meshesByType: new Map(),
        instanceMeta: new Map(),
        visibleCount: 0
      };
    }

    function disposeChunk(chunk) {
      if (!chunk) return;

      for (const mesh of chunk.meshesByType.values()) {
        chunk.group.remove(mesh);
      }

      scene.remove(chunk.group);
    }

    function rebuildChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      const oldChunk = chunks.get(key);

      if (oldChunk) {
        disposeChunk(oldChunk);
      }

      const chunk = createChunk(cx, cz);
      const startX = cx * CHUNK_SIZE;
      const startZ = cz * CHUNK_SIZE;

      const visibleByType = new Map();
      for (const type of BLOCK_TYPES) visibleByType.set(type, []);

      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        for (let lz = 0; lz < CHUNK_SIZE; lz++) {
          const x = startX + lx;
          const z = startZ + lz;
          const h = getTerrainHeight(x, z);
          const maxY = h + WORLD_TOP_BUFFER;

          for (let y = WORLD_BOTTOM; y <= maxY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;
            if (!isBlockVisible(x, y, z)) continue;

            visibleByType.get(type).push({ x, y, z });
            chunk.visibleCount++;
          }
        }
      }

      for (const type of BLOCK_TYPES) {
        const blocks = visibleByType.get(type);
        if (!blocks.length) continue;

        const mesh = new THREE.InstancedMesh(boxGeo, materials[type], blocks.length);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.frustumCulled = true;
        mesh.userData.blockType = type;
        mesh.userData.chunkKey = key;

        const meta = new Array(blocks.length);

        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          dummy.position.set(b.x, b.y, b.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
          meta[i] = { x: b.x, y: b.y, z: b.z, type };
        }

        mesh.instanceMatrix.needsUpdate = true;
        chunk.meshesByType.set(type, mesh);
        chunk.instanceMeta.set(mesh, meta);
        chunk.group.add(mesh);
      }

      scene.add(chunk.group);
      chunks.set(key, chunk);
    }

    function loadChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      if (chunks.has(key)) return;
      rebuildChunk(cx, cz);
    }

    function unloadChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      const chunk = chunks.get(key);
      if (!chunk) return;
      disposeChunk(chunk);
      chunks.delete(key);
    }

    function rebuildChunkAndNeighborsByBlock(x, z) {
      const cx = floorDiv(x, CHUNK_SIZE);
      const cz = floorDiv(z, CHUNK_SIZE);

      rebuildChunk(cx, cz);

      const localX = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const localZ = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;

      if (localX === 0) rebuildChunk(cx - 1, cz);
      if (localX === CHUNK_SIZE - 1) rebuildChunk(cx + 1, cz);
      if (localZ === 0) rebuildChunk(cx, cz - 1);
      if (localZ === CHUNK_SIZE - 1) rebuildChunk(cx, cz + 1);
    }

    function updateChunks(force = false) {
      const cx = floorDiv(camera.position.x, CHUNK_SIZE);
      const cz = floorDiv(camera.position.z, CHUNK_SIZE);

      if (!force && cx === currentChunkX && cz === currentChunkZ) return;

      currentChunkX = cx;
      currentChunkZ = cz;

      const needed = new Set();

      for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
        for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
          const nx = cx + dx;
          const nz = cz + dz;
          const key = chunkKey(nx, nz);
          needed.add(key);
          loadChunk(nx, nz);
        }
      }

      for (const key of Array.from(chunks.keys())) {
        if (!needed.has(key)) {
          const [ux, uz] = key.split(',').map(Number);
          unloadChunk(ux, uz);
        }
      }
    }

    // ---------------------------
    // Collision
    // ---------------------------
    function getFeetY(pos) {
      return pos.y - PLAYER_EYE_HEIGHT;
    }

    function setFeetY(pos, feetY) {
      pos.y = feetY + PLAYER_EYE_HEIGHT;
    }

    function playerBoxAt(pos) {
      const feetY = getFeetY(pos);
      return {
        minX: pos.x - PLAYER_HALF,
        maxX: pos.x + PLAYER_HALF,
        minY: feetY,
        maxY: feetY + PLAYER_HEIGHT,
        minZ: pos.z - PLAYER_HALF,
        maxZ: pos.z + PLAYER_HALF
      };
    }

    function blockBox(x, y, z) {
      return {
        minX: x - 0.5,
        maxX: x + 0.5,
        minY: y - 0.5,
        maxY: y + 0.5,
        minZ: z - 0.5,
        maxZ: z + 0.5
      };
    }

    function intersects(a, b) {
      return (
        a.minX < b.maxX && a.maxX > b.minX &&
        a.minY < b.maxY && a.maxY > b.minY &&
        a.minZ < b.maxZ && a.maxZ > b.minZ
      );
    }

    function collidesAt(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minY = Math.floor(pBox.minY);
      const maxY = Math.floor(pBox.maxY);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;

            const bBox = blockBox(x, y, z);
            if (intersects(pBox, bBox)) return true;
          }
        }
      }
      return false;
    }

    function isPlacementInsidePlayer(pos) {
      const pBox = playerBoxAt(camera.position);
      const bBox = blockBox(pos.x, pos.y, pos.z);
      return intersects(pBox, bBox);
    }

    function getFloorY(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);
      const startY = Math.floor(pBox.minY) - 3;
      const endY = Math.floor(pBox.minY) + 1;

      let bestTop = -Infinity;

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = startY; y <= endY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;

            const bb = blockBox(x, y, z);
            const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
            const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

            if (!overlapX || !overlapZ) continue;

            if (bb.maxY <= pBox.minY + 0.2 && bb.maxY > bestTop) {
              bestTop = bb.maxY;
            }
          }
        }
      }

      return bestTop;
    }

    function getCeilingY(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);
      const startY = Math.floor(pBox.maxY) - 1;
      const endY = Math.floor(pBox.maxY) + 3;

      let bestBottom = Infinity;

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = startY; y <= endY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;

            const bb = blockBox(x, y, z);
            const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
            const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

            if (!overlapX || !overlapZ) continue;

            if (bb.minY >= pBox.maxY - 0.2 && bb.minY < bestBottom) {
              bestBottom = bb.minY;
            }
          }
        }
      }

      return bestBottom;
    }

    function tryMoveAxis(dx, dz, velocity) {
      if (dx !== 0) {
        const next = camera.position.clone();
        next.x += dx;

        if (!collidesAt(next)) {
          camera.position.x = next.x;
        } else {
          const step = next.clone();
          step.y += STEP_HEIGHT;
          if (!collidesAt(step)) {
            camera.position.x = next.x;
            camera.position.y = step.y;
          } else {
            velocity.x = 0;
          }
        }
      }

      if (dz !== 0) {
        const next = camera.position.clone();
        next.z += dz;

        if (!collidesAt(next)) {
          camera.position.z = next.z;
        } else {
          const step = next.clone();
          step.y += STEP_HEIGHT;
          if (!collidesAt(step)) {
            camera.position.z = next.z;
            camera.position.y = step.y;
          } else {
            velocity.z = 0;
          }
        }
      }
    }

    function resolveVertical(delta, velocity, state) {
      camera.position.y += velocity.y * delta;

      if (velocity.y > 0) {
        const ceiling = getCeilingY(camera.position);
        if (ceiling < Infinity) {
          const pBox = playerBoxAt(camera.position);
          if (pBox.maxY > ceiling) {
            const newFeet = ceiling - PLAYER_HEIGHT - EPS;
            setFeetY(camera.position, newFeet);
            velocity.y = 0;
          }
        }
      }

      const floorY = getFloorY(camera.position);
      state.canJump = false;

      if (floorY > -Infinity) {
        const feetY = getFeetY(camera.position);
        if (feetY <= floorY + 0.08 && velocity.y <= 0) {
          setFeetY(camera.position, floorY);
          velocity.y = 0;
          state.canJump = true;
        }
      }
    }

    // ---------------------------
    // Highlight / picking
    // ---------------------------
    const highlightGeo = new THREE.BoxGeometry(1.03, 1.03, 1.03);
    const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const highlight = new THREE.Mesh(highlightGeo, highlightMat);
    highlight.visible = false;
    scene.add(highlight);

    let currentTargetBlock = null;
    let raycastTargets = [];

    function refreshRaycastTargets() {
      raycastTargets = [];
      for (const chunk of chunks.values()) {
        for (const mesh of chunk.meshesByType.values()) {
          raycastTargets.push(mesh);
        }
      }
    }

    function updateBlockHighlight() {
      if (!gameStarted) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.far = 8;

      const hits = raycaster.intersectObjects(raycastTargets, false);
      if (hits.length === 0) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      const hit = hits[0];
      const chunk = chunks.get(hit.object.userData.chunkKey);
      if (!chunk) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      const meta = chunk.instanceMeta.get(hit.object);
      const block = meta?.[hit.instanceId];
      if (!block) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      highlight.position.set(block.x, block.y, block.z);
      highlight.visible = true;
      currentTargetBlock = {
        x: block.x,
        y: block.y,
        z: block.z,
        type: block.type,
        faceNormal: hit.face?.normal?.clone() || new THREE.Vector3()
      };
    }

    function breakBlockAt(x, y, z, type) {
      modifiedBlocks.set(blockKey(x, y, z), null);
      inventory[type] = (inventory[type] || 0) + 1;
      updateUI();
      rebuildChunkAndNeighborsByBlock(x, z);
      refreshRaycastTargets();
    }

    function placeBlock(x, y, z, type) {
      if (isSolidBlockAt(x, y, z)) return;
      modifiedBlocks.set(blockKey(x, y, z), type);
      inventory[type]--;
      updateUI();
      rebuildChunkAndNeighborsByBlock(x, z);
      refreshRaycastTargets();
    }

    window.addEventListener('mousedown', (e) => {
      if (!gameStarted || !controls.isLocked) return;
      if (!currentTargetBlock) return;

      if (e.button === 0) {
        breakBlockAt(
          currentTargetBlock.x,
          currentTargetBlock.y,
          currentTargetBlock.z,
          currentTargetBlock.type
        );
        return;
      }

      if (e.button === 2) {
        if (inventory[selectedBlockType] <= 0) return;

        const pos = new THREE.Vector3(
          currentTargetBlock.x,
          currentTargetBlock.y,
          currentTargetBlock.z
        ).add(currentTargetBlock.faceNormal);

        pos.x = Math.round(pos.x);
        pos.y = Math.round(pos.y);
        pos.z = Math.round(pos.z);

        if (isSolidBlockAt(pos.x, pos.y, pos.z)) return;
        if (isPlacementInsidePlayer(pos)) return;

        placeBlock(pos.x, pos.y, pos.z, selectedBlockType);
      }
    });

    window.addEventListener('contextmenu', e => e.preventDefault());

    // ---------------------------
    // Input / Movement
    // ---------------------------
    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;

    const velocity = new THREE.Vector3(0, 0, 0);
    const movementState = { canJump: false };

    function resetMovementKeys() {
      moveForward = false;
      moveBackward = false;
      moveLeft = false;
      moveRight = false;
      velocity.set(0, 0, 0);
      movementState.canJump = false;
    }

    function clearWorld() {
      for (const chunk of chunks.values()) {
        disposeChunk(chunk);
      }
      chunks.clear();
      modifiedBlocks.clear();
      refreshRaycastTargets();
      highlight.visible = false;
      currentTargetBlock = null;
      currentChunkX = null;
      currentChunkZ = null;
    }

    function returnToLobby() {
      controls.unlock();
      resetMovementKeys();
      clearWorld();
      gameStarted = false;
      gameRoot.style.display = 'none';
      lobby.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('show') && e.key === 'Escape') {
        closeModal();
        return;
      }

      if (gameStarted && e.key === 'Escape') {
        returnToLobby();
        return;
      }

      if (!gameStarted) return;

      for (const type of BLOCK_TYPES) {
        if (e.key === BLOCK_DATA[type].key) {
          selectedBlockType = type;
          updateUI();
        }
      }

      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;

      if (e.code === 'Space' && movementState.canJump) {
        velocity.y = 8.5;
        movementState.canJump = false;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (!gameStarted) return;
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    // ---------------------------
    // Start game
    // ---------------------------
    function startGame() {
      lobby.style.display = 'none';
      gameRoot.style.display = 'block';
      gameStarted = true;

      const spawnX = 0;
      const spawnZ = 0;
      const terrainY = getTerrainHeight(spawnX, spawnZ);

      camera.position.set(spawnX, terrainY + PLAYER_EYE_HEIGHT + 2, spawnZ);

      currentChunkX = null;
      currentChunkZ = null;
      updateChunks(true);
      refreshRaycastTargets();

      const floorY = getFloorY(camera.position);
      if (floorY > -Infinity) {
        setFeetY(camera.position, floorY + 0.01);
      }

      controls.lock();
    }

    document.getElementById('singleBtn').addEventListener('click', startGame);

    // ---------------------------
    // Animate
    // ---------------------------
    let prevTime = performance.now();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveDir = new THREE.Vector3();

    let fpsFrame = 0;
    let fpsTime = 0;
    let fpsValue = 0;

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.05);

      if (gameStarted) {
        updateChunks();

        if (controls.isLocked) {
          velocity.x *= Math.max(0, 1 - 10 * delta);
          velocity.z *= Math.max(0, 1 - 10 * delta);
          velocity.y -= 24 * delta;

          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();

          right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

          moveDir.set(0, 0, 0);
          if (moveForward) moveDir.add(forward);
          if (moveBackward) moveDir.sub(forward);
          if (moveRight) moveDir.add(right);
          if (moveLeft) moveDir.sub(right);

          if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
            const accel = 30;
            velocity.x += moveDir.x * accel * delta;
            velocity.z += moveDir.z * accel * delta;
          }

          const maxSpeed = 6;
          const horizontalSpeed = Math.hypot(velocity.x, velocity.z);
          if (horizontalSpeed > maxSpeed) {
            const scale = maxSpeed / horizontalSpeed;
            velocity.x *= scale;
            velocity.z *= scale;
          }

          tryMoveAxis(velocity.x * delta, velocity.z * delta, velocity);
          resolveVertical(delta, velocity, movementState);

          if (camera.position.y < WORLD_BOTTOM - 20) {
            const x = Math.round(camera.position.x);
            const z = Math.round(camera.position.z);
            camera.position.set(x, getTerrainHeight(x, z) + PLAYER_EYE_HEIGHT + 2, z);
            velocity.set(0, 0, 0);
          }
        }

        updateBlockHighlight();

        fpsFrame++;
        fpsTime += delta;
        if (fpsTime >= 0.5) {
          fpsValue = Math.round(fpsFrame / fpsTime);
          fpsFrame = 0;
          fpsTime = 0;

          let totalVisible = 0;
          for (const c of chunks.values()) totalVisible += c.visibleCount;

          perfInfo.innerHTML = `
            FPS: ${fpsValue}<br>
            로드 청크: ${chunks.size}<br>
            렌더 블록: ${totalVisible.toLocaleString()}<br>
            렌더 거리: ${RENDER_DISTANCE}<br>
            나무 확률: ${(TREE_CHANCE * 100).toFixed(1)}%
          `;
        }
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    });

    animate();
  </script>
</body>
</html>
