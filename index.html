<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Minecraft - 텔레포트 버그 수정본</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px;
            border: 2px solid white; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; bottom: 10px;
            color: white; font-family: 'Malgun Gothic', sans-serif;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px;
            overflow-y: auto;
            width: 240px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        #ui::-webkit-scrollbar { width: 6px; }
        #ui::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .inv-item {
            margin-top: 4px; padding: 6px; border-radius: 4px;
            font-size: 0.85em; border: 1px solid transparent;
            cursor: pointer; display: flex; justify-content: space-between;
        }
        .inv-item:hover { background: rgba(255,255,255,0.1); }
        .active {
            background: rgba(0, 255, 0, 0.15);
            border: 1px solid #00ff00; color: #00ff00; font-weight: bold;
        }
        .category {
            margin-top: 15px; color: #ffeb3b; font-weight: bold; font-size: 0.9em;
            border-bottom: 1px solid #555; padding-bottom: 3px;
        }
        .block-count { color: #aaa; }
        .active .block-count { color: #00ff00; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div style="font-weight: bold; font-size: 1.1em; margin-bottom: 5px; text-align:center;">⛏️ 인벤토리</div>
        <div style="font-size:0.8em; color:#aaa; text-align:center; margin-bottom:10px;">[1~0] 키로 선택</div>
        <div id="inventory-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const BLOCK_DATA = {
            "grass":     { name: "잔디 블록", color: 0x7cfc00, cat: "자연", key: "1" },
            "dirt":      { name: "흙", color: 0x5d4037, cat: "자연", key: "2" },
            "stone":     { name: "돌", color: 0x808080, cat: "자연", key: "3" },
            "deepslate": { name: "심층암", color: 0x3d3d3d, cat: "자연", key: "4" },
            "sand":      { name: "모래", color: 0xd2b48c, cat: "자연", key: "5" },
            "log":       { name: "원목", color: 0x6f4e37, cat: "나무", key: "6" },
            "leaves":    { name: "나뭇잎", color: 0x228b22, cat: "나무", key: "7" },
            "coal":      { name: "석탄 광석", color: 0x2c2c2c, cat: "광석", key: "8" },
            "iron":      { name: "철 광석", color: 0xd8d8d8, cat: "광석", key: "9" },
            "diamond":   { name: "다이아몬드", color: 0x00ffff, cat: "광석", key: "0" }
        };

        let inventory = {};
        let selectedBlockType = "grass";
        Object.keys(BLOCK_DATA).forEach(type => inventory[type] = 20);

        function updateUI() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            let lastCat = "";

            Object.keys(BLOCK_DATA).forEach(type => {
                const data = BLOCK_DATA[type];

                if (data.cat !== lastCat) {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category';
                    catDiv.innerText = data.cat;
                    list.appendChild(catDiv);
                    lastCat = data.cat;
                }

                const div = document.createElement('div');
                div.className = `inv-item ${selectedBlockType === type ? 'active' : ''}`;
                div.innerHTML = `<span>[${data.key}] ${data.name}</span> <span class="block-count">${inventory[type]}</span>`;
                div.onclick = () => {
                    selectedBlockType = type;
                    updateUI();
                };
                list.appendChild(div);
            });
        }
        updateUI();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => {
            if (!controls.isLocked) controls.lock();
        });

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 30, 15);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -50;
        sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50;
        sun.shadow.camera.bottom = -50;
        scene.add(sun);

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        function createBlock(x, y, z, type) {
            const mat = new THREE.MeshLambertMaterial({ color: BLOCK_DATA[type].color });
            const block = new THREE.Mesh(boxGeo, mat);
            block.position.set(x, y, z);
            block.name = type;

            block.castShadow = true;
            block.receiveShadow = true;

            scene.add(block);
            blocks.push(block);
        }

        const range = 15;
        const groundY = 0;

        for (let x = -range; x <= range; x++) {
            for (let z = -range; z <= range; z++) {
                createBlock(x, groundY, z, 'grass');

                for (let y = -1; y >= -10; y--) {
                    let type = 'stone';

                    if (y >= -2) type = 'dirt';
                    else if (y < -6) type = 'deepslate';

                    const rand = Math.random();
                    if (y < -1 && rand < 0.05) type = 'coal';
                    if (y < -3 && rand < 0.03) type = 'iron';
                    if (y < -7 && rand < 0.01) type = 'diamond';

                    createBlock(x, y, z, type);
                }

                if (
                    x > -range + 1 && x < range - 1 &&
                    z > -range + 1 && z < range - 1 &&
                    Math.random() < 0.03
                ) {
                    growTree(x, groundY + 1, z);
                }
            }
        }

        function growTree(x, y, z) {
            const trunkHeight = 4 + Math.floor(Math.random() * 2);

            for (let i = 0; i < trunkHeight; i++) {
                createBlock(x, y + i, z, 'log');
            }

            const leafBaseY = y + trunkHeight - 2;
            for (let li = 0; li < 3; li++) {
                const radius = 2 - li;
                for (let lx = -radius; lx <= radius; lx++) {
                    for (let lz = -radius; lz <= radius; lz++) {
                        if (li < 2 && Math.abs(lx) === radius && Math.abs(lz) === radius) continue;
                        if (lx === 0 && lz === 0 && li < 2) continue;
                        createBlock(x + lx, leafBaseY + li, z + lz, 'leaves');
                    }
                }
            }
        }

        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 8;

            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) {
                    const blockType = intersect.object.name;
                    inventory[blockType]++;

                    scene.remove(intersect.object);
                    blocks.splice(blocks.indexOf(intersect.object), 1);
                } else if (e.button === 2) {
                    if (inventory[selectedBlockType] > 0 && intersect.distance > 1.5) {
                        const pos = intersect.object.position.clone().add(intersect.face.normal);

                        if (
                            Math.round(pos.x) === Math.round(camera.position.x) &&
                            Math.round(pos.z) === Math.round(camera.position.z) &&
                            (
                                Math.round(pos.y) === Math.round(camera.position.y) ||
                                Math.round(pos.y) === Math.round(camera.position.y - 1)
                            )
                        ) {
                            return;
                        }

                        createBlock(pos.x, pos.y, pos.z, selectedBlockType);
                        inventory[selectedBlockType]--;
                    }
                }

                updateUI();
            }
        });

        document.addEventListener('keydown', (e) => {
            Object.keys(BLOCK_DATA).forEach(type => {
                if (e.key === BLOCK_DATA[type].key) {
                    selectedBlockType = type;
                    updateUI();
                }
            });

            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyD') moveRight = true;

            if (e.code === 'Space' && canJump) {
                velocity.y += 8;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        const PLAYER_HEIGHT_OFFSET = 2.1;

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();

            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.5 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const moveSpeed = 90.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * moveSpeed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * moveSpeed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += velocity.y * delta;

                // ===== 수정된 바닥 충돌 감지 =====
                canJump = false;

                const pX = Math.round(camera.position.x);
                const pZ = Math.round(camera.position.z);

                // 플레이어 "발 아래 기준 높이"
                const playerFootReferenceY = camera.position.y - PLAYER_HEIGHT_OFFSET;

                let highestFloorY = -Infinity;

                for (const b of blocks) {
                    if (Math.round(b.position.x) === pX && Math.round(b.position.z) === pZ) {
                        // 플레이어 아래에 있는 블록만 바닥 후보로 인정
                        if (b.position.y <= playerFootReferenceY + 0.01) {
                            if (b.position.y > highestFloorY) {
                                highestFloorY = b.position.y;
                            }
                        }
                    }
                }

                const groundLevel = (highestFloorY === -Infinity ? -20 : highestFloorY + PLAYER_HEIGHT_OFFSET);

                if (camera.position.y <= groundLevel) {
                    velocity.y = 0;
                    camera.position.y = groundLevel;
                    canJump = true;
                }
                // ===== 수정 끝 =====
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
