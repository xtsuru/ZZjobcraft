<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Minecraft Chunk World</title>

<style>
body { margin:0; overflow:hidden; font-family: monospace; }

#lobby {
  position:absolute;
  width:100%;
  height:100%;
  background: linear-gradient(#7ec0ee, #7bc96f);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:10;
}

.mc-btn {
  padding:20px;
  font-size:24px;
  background:#9a9a9a;
  border:4px solid black;
  cursor:pointer;
}

canvas { display:block; }
</style>
</head>

<body>

<div id="lobby">
  <h1>MINECRAFT</h1>
  <button class="mc-btn" id="start">싱글플레이</button>
</div>

<canvas id="game"></canvas>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js";

// ===== 기본 설정 =====
const canvas = document.getElementById("game");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas});
renderer.setSize(window.innerWidth, window.innerHeight);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,20,10);
scene.add(light);

// ===== 플레이어 =====
camera.position.set(0,10,0);

let velocityY = 0;
let onGround = false;

const keys = {};
document.addEventListener("keydown", e=>keys[e.key]=true);
document.addEventListener("keyup", e=>keys[e.key]=false);

document.getElementById("start").onclick = () => {
  document.getElementById("lobby").style.display="none";
  document.body.requestPointerLock();
};

// ===== 청크 설정 =====
const CHUNK_SIZE = 16;
const RENDER_DISTANCE = 3;

const chunks = {};
const blockGeo = new THREE.BoxGeometry(1,1,1);

function getHeight(x,z){
  return Math.floor(Math.sin(x*0.1)*2 + Math.cos(z*0.1)*2);
}

function createChunk(cx,cz){
  const key = cx + "," + cz;
  if(chunks[key]) return;

  const group = new THREE.Group();

  for(let x=0;x<CHUNK_SIZE;x++){
    for(let z=0;z<CHUNK_SIZE;z++){
      const worldX = cx*CHUNK_SIZE + x;
      const worldZ = cz*CHUNK_SIZE + z;

      const height = getHeight(worldX, worldZ);

      for(let y=0;y<=height;y++){
        const color = (y === height) ? 0x00ff00 : 0x8B4513;
        const mat = new THREE.MeshStandardMaterial({color});
        const cube = new THREE.Mesh(blockGeo, mat);

        cube.position.set(worldX, y, worldZ);
        group.add(cube);
      }
    }
  }

  scene.add(group);
  chunks[key] = group;
}

function removeChunk(cx,cz){
  const key = cx + "," + cz;
  if(!chunks[key]) return;

  scene.remove(chunks[key]);
  delete chunks[key];
}

function updateChunks(){
  const cx = Math.floor(camera.position.x / CHUNK_SIZE);
  const cz = Math.floor(camera.position.z / CHUNK_SIZE);

  const needed = {};

  for(let x=-RENDER_DISTANCE;x<=RENDER_DISTANCE;x++){
    for(let z=-RENDER_DISTANCE;z<=RENDER_DISTANCE;z++){
      const nx = cx + x;
      const nz = cz + z;
      const key = nx + "," + nz;

      needed[key] = true;
      createChunk(nx, nz);
    }
  }

  for(const key in chunks){
    if(!needed[key]){
      const [x,z] = key.split(",").map(Number);
      removeChunk(x,z);
    }
  }
}

// ===== 마우스 회전 =====
let rotX=0, rotY=0;

document.addEventListener("mousemove", e=>{
  if(document.pointerLockElement){
    rotY -= e.movementX*0.002;
    rotX -= e.movementY*0.002;
    rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
  }
});

// ===== 게임 루프 =====
function animate(){
  requestAnimationFrame(animate);

  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);

  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));

  if(keys["w"]) camera.position.addScaledVector(dir, 0.2);
  if(keys["s"]) camera.position.addScaledVector(dir, -0.2);
  if(keys["a"]) camera.position.addScaledVector(right, -0.2);
  if(keys["d"]) camera.position.addScaledVector(right, 0.2);

  if(keys[" "] && onGround){
    velocityY = 0.25;
    onGround=false;
  }

  velocityY -= 0.01;
  camera.position.y += velocityY;

  if(camera.position.y < 3){
    camera.position.y = 3;
    velocityY = 0;
    onGround=true;
  }

  camera.rotation.order="YXZ";
  camera.rotation.y = rotY;
  camera.rotation.x = rotX;

  updateChunks();

  renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
