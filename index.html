<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Minecraft - 물리 버그 수정 버전</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px;
            border: 2px solid white; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; bottom: 10px;
            color: white; font-family: 'Malgun Gothic', sans-serif;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px;
            overflow-y: auto; width: 240px;
        }
        .inv-item { margin-top: 4px; padding: 6px; border-radius: 4px; font-size: 0.85em; display: flex; justify-content: space-between; }
        .active { background: rgba(0, 255, 0, 0.15); border: 1px solid #00ff00; color: #00ff00; font-weight: bold; }
        .category { margin-top: 15px; color: #ffeb3b; font-weight: bold; font-size: 0.9em; border-bottom: 1px solid #555; padding-bottom: 3px; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div style="font-weight: bold; margin-bottom: 10px; text-align:center;">⛏️ 인벤토리</div>
        <div id="inventory-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const BLOCK_DATA = {
            "grass": { name: "잔디 블록", color: 0x7cfc00, cat: "자연", key: "1" },
            "dirt":  { name: "흙", color: 0x5d4037, cat: "자연", key: "2" },
            "stone": { name: "돌", color: 0x808080, cat: "자연", key: "3" },
            "deepslate": { name: "심층암", color: 0x3d3d3d, cat: "자연", key: "4" },
            "log": { name: "원목", color: 0x6f4e37, cat: "나무", key: "5" },
            "leaves": { name: "나뭇잎", color: 0x228b22, cat: "나무", key: "6" },
            "diamond": { name: "다이아몬드", color: 0x00ffff, cat: "광석", key: "7" }
        };

        let inventory = {};
        let selectedBlockType = "grass";
        Object.keys(BLOCK_DATA).forEach(type => inventory[type] = 10);

        function updateUI() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            let lastCat = "";
            Object.keys(BLOCK_DATA).forEach(type => {
                const data = BLOCK_DATA[type];
                if(data.cat !== lastCat) {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category';
                    catDiv.innerText = data.cat;
                    list.appendChild(catDiv);
                    lastCat = data.cat;
                }
                const div = document.createElement('div');
                div.className = `inv-item ${selectedBlockType === type ? 'active' : ''}`;
                div.innerHTML = `<span>[${data.key}] ${data.name}</span> <span>${inventory[type]}</span>`;
                div.onclick = () => { selectedBlockType = type; updateUI(); };
                list.appendChild(div);
            });
        }
        updateUI();

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        function createBlock(x, y, z, type) {
            const mat = new THREE.MeshLambertMaterial({ color: BLOCK_DATA[type].color });
            const block = new THREE.Mesh(boxGeo, mat);
            block.position.set(x, y, z);
            block.name = type;
            scene.add(block);
            blocks.push(block);
        }

        // 지형 및 나무 생성
        const range = 10;
        for (let x = -range; x <= range; x++) {
            for (let z = -range; z <= range; z++) {
                createBlock(x, 0, z, 'grass');
                createBlock(x, -1, z, 'dirt');
                createBlock(x, -2, z, 'stone');
                if (Math.random() < 0.02) { // 나무 생성
                    for(let h=1; h<=3; h++) createBlock(x, h, z, 'log');
                    createBlock(x, 4, z, 'leaves');
                }
            }
        }

        // 입력 처리
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);
            if (intersects.length > 0) {
                const intersect = intersects[0];
                if (e.button === 0) { // 파괴
                    inventory[intersect.object.name]++;
                    scene.remove(intersect.object);
                    blocks.splice(blocks.indexOf(intersect.object), 1);
                } else if (e.button === 2) { // 설치
                    if (inventory[selectedBlockType] > 0) {
                        const pos = intersect.object.position.clone().add(intersect.face.normal);
                        createBlock(pos.x, pos.y, pos.z, selectedBlockType);
                        inventory[selectedBlockType]--;
                    }
                }
                updateUI();
            }
        });

        document.addEventListener('keydown', (e) => {
            Object.keys(BLOCK_DATA).forEach(type => { if (e.key === BLOCK_DATA[type].key) { selectedBlockType = type; updateUI(); } });
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) { velocity.y += 7; canJump = false; }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.2 * delta; 

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();
                if (moveForward || moveBackward) velocity.z -= direction.z * 80.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 80.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                camera.position.y += (velocity.y * delta);

                // --- 버그 수정된 충돌 감지 로직 ---
                canJump = false;
                const playerX = Math.round(camera.position.x);
                const playerZ = Math.round(camera.position.z);
                const playerFeetY = camera.position.y - 1.6; // 플레이어 발 위치 (눈높이에서 1.6 아래)

                let floorY = -Infinity;

                for (let b of blocks) {
                    // 1. 수평 좌표(X, Z)가 일치하고
                    if (Math.round(b.position.x) === playerX && Math.round(b.position.z) === playerZ) {
                        // 2. 블록의 윗면이 플레이어의 발 위치보다 아래에 있을 때만 감지
                        // 0.1의 여유값(Tolerance)을 주어 끼임 현상 방지
                        if (b.position.y <= playerFeetY + 0.1) {
                            if (b.position.y > floorY) floorY = b.position.y;
                        }
                    }
                }

                const groundLevel = (floorY === -Infinity ? -20 : floorY) + 2.1;

                // 바닥 아래로 내려가지 않게 고정
                if (camera.position.y <= groundLevel) {
                    velocity.y = Math.max(0, velocity.y); // 떨어지는 속도만 0으로
                    camera.position.y = groundLevel;
                    canJump = true;
                }
            }
            prevTime = time;
            renderer.render(scene, camera);
        }
        window.addEventListener('contextmenu', e => e.preventDefault());
        animate();
    </script>
</body>
</html>
