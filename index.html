<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Minecraft Web</title>

<style>
body { margin:0; overflow:hidden; font-family: monospace; }

/* ===== 로비 ===== */
#lobby {
  position:absolute;
  width:100%;
  height:100%;
  background: linear-gradient(#7ec0ee, #7bc96f);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.title {
  font-size:70px;
  font-weight:bold;
  margin-bottom:50px;
}

.mc-btn {
  width:300px;
  padding:15px;
  margin:10px;
  font-size:20px;
  background:#9a9a9a;
  border:4px solid #000;
  cursor:pointer;
}

.mc-btn:hover { background:#bcbcbc; }

/* ===== 게임 ===== */
#gameCanvas {
  display:none;
}
</style>
</head>

<body>

<!-- ===== 로비 ===== -->
<div id="lobby">
  <div class="title">MINECRAFT</div>
  <button class="mc-btn" id="startBtn">싱글플레이</button>
</div>

<!-- ===== 게임 ===== -->
<canvas id="gameCanvas"></canvas>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158/build/three.module.js";

// ===== 버튼 클릭 =====
document.getElementById("startBtn").onclick = () => {
  document.getElementById("lobby").style.display = "none";
  document.getElementById("gameCanvas").style.display = "block";
  startGame();
};

// ===== 게임 시작 =====
function startGame(){

  const canvas = document.getElementById("gameCanvas");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer({canvas});
  renderer.setSize(window.innerWidth, window.innerHeight);

  // ===== 조명 =====
  const light = new THREE.DirectionalLight(0xffffff,1);
  light.position.set(5,10,5);
  scene.add(light);

  // ===== 바닥 =====
  const geo = new THREE.BoxGeometry(1,1,1);
  const mat = new THREE.MeshStandardMaterial({color:0x00ff00});

  for(let x=-10;x<10;x++){
    for(let z=-10;z<10;z++){
      const cube = new THREE.Mesh(geo,mat);
      cube.position.set(x,0,z);
      scene.add(cube);
    }
  }

  // ===== 플레이어 =====
  camera.position.set(0,2,5);

  let velocityY = 0;
  let onGround = false;

  const keys = {};

  document.addEventListener("keydown", e => keys[e.key]=true);
  document.addEventListener("keyup", e => keys[e.key]=false);

  document.body.requestPointerLock();

  let rotY = 0;
  let rotX = 0;

  document.addEventListener("mousemove", e=>{
    if(document.pointerLockElement){
      rotY -= e.movementX * 0.002;
      rotX -= e.movementY * 0.002;
      rotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotX));
    }
  });

  function animate(){
    requestAnimationFrame(animate);

    // 방향 벡터
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));

    // 이동
    if(keys["w"]) camera.position.addScaledVector(dir, 0.1);
    if(keys["s"]) camera.position.addScaledVector(dir, -0.1);
    if(keys["a"]) camera.position.addScaledVector(right, -0.1);
    if(keys["d"]) camera.position.addScaledVector(right, 0.1);

    // 점프
    if(keys[" "] && onGround){
      velocityY = 0.2;
      onGround = false;
    }

    velocityY -= 0.01;
    camera.position.y += velocityY;

    // 바닥 충돌
    if(camera.position.y < 2){
      camera.position.y = 2;
      velocityY = 0;
      onGround = true;
    }

    // 회전 적용
    camera.rotation.order = "YXZ";
    camera.rotation.y = rotY;
    camera.rotation.x = rotX;

    renderer.render(scene, camera);
  }

  animate();
}

</script>

</body>
</html>
