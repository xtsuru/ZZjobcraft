<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Web - HUD Lower + Less Lag</title>
  <style>
    * {
      box-sizing: border-box;
      image-rendering: pixelated;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace, "Malgun Gothic", sans-serif;
      background: #000;
    }

    canvas { display: block; }

    #lobby {
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, #7ec0ee 0%, #9bd0ff 45%, #7bc96f 46%, #5ea84a 100%);
      z-index: 100;
      color: white;
    }

    .lobby-screen {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .title-wrap {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .title {
      font-size: 86px;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d9d3d0;
      text-shadow:
        0 6px 0 #4b4747,
        -4px -4px 0 #000,
        4px -4px 0 #000,
        -4px 4px 0 #000,
        4px 4px 0 #000,
        0 -4px 0 #000,
        0 4px 0 #000,
        -4px 0 0 #000,
        4px 0 0 #000;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 34px;
      font-weight: 800;
      color: #d9d3d0;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        0 3px 0 #000;
    }

    .splash {
      position: absolute;
      right: -120px;
      top: 40px;
      transform: rotate(-18deg);
      font-size: 28px;
      font-weight: 900;
      color: #ffe600;
      text-shadow:
        -2px -2px 0 #4c4c00,
        2px -2px 0 #4c4c00,
        -2px 2px 0 #4c4c00,
        2px 2px 0 #4c4c00;
      white-space: nowrap;
    }

    .menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -42%);
      width: 760px;
      max-width: calc(100% - 40px);
    }

    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .menu-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 22px;
    }

    .mc-btn {
      width: 100%;
      height: 72px;
      border: 4px solid #1b1b1b;
      background: linear-gradient(to bottom, #bdbdbd 0%, #a9a9a9 49%, #8d8d8d 50%, #9a9a9a 100%);
      color: #f2f2f2;
      font-size: 26px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.35),
        inset 0 -3px 0 rgba(0,0,0,0.25),
        0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.05s ease, filter 0.08s ease;
    }

    .mc-btn:hover { filter: brightness(1.08); }
    .mc-btn:active { transform: translateY(2px); }

    .mc-btn.realms {
      position: relative;
      padding-right: 80px;
    }

    .mc-btn.realms::after {
      content: "◆";
      position: absolute;
      right: 26px;
      top: 50%;
      transform: translateY(-50%);
      color: #1de9b6;
      font-size: 30px;
    }

    .bottom-left,
    .bottom-right {
      position: absolute;
      bottom: 16px;
      font-size: 18px;
      font-weight: 700;
      text-shadow:
        -2px -2px 0 rgba(0,0,0,0.6),
        2px -2px 0 rgba(0,0,0,0.6),
        -2px 2px 0 rgba(0,0,0,0.6),
        2px 2px 0 rgba(0,0,0,0.6);
    }

    .bottom-left { left: 16px; }
    .bottom-right { right: 16px; }

    .panel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 20;
    }

    .panel.show { display: flex; }

    .dialog {
      width: 560px;
      max-width: calc(100% - 24px);
      background: #2e2e2e;
      border: 4px solid #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 22px;
    }

    .dialog-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 14px;
      color: white;
    }

    .dialog-text {
      font-size: 18px;
      line-height: 1.5;
      color: #e6e6e6;
      margin-bottom: 18px;
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
    }

    .small-btn {
      height: 56px;
      font-size: 20px;
    }

    #gameRoot {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      border: 2px solid white;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    #crosshair.hidden {
      display: none;
    }

    #pauseHint {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 10px;
      border-radius: 6px;
    }

    #perfInfo {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-size: 12px;
      line-height: 1.5;
      background: rgba(0,0,0,0.5);
      padding: 8px 10px;
      border-radius: 6px;
      min-width: 150px;
    }

    /* HUD - 더 아래 */
    #hudWrap {
      position: absolute;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      z-index: 13;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      pointer-events: none;
    }

    #hudTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      width: 360px;
    }

    .hud-icons {
      display: flex;
      gap: 1px;
      font-size: 20px;
      line-height: 1;
      text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
    }

    #xpLevel {
      color: #7dff43;
      font-size: 20px;
      font-weight: 900;
      text-shadow:
        2px 2px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
      margin-bottom: -2px;
    }

    #xpBarOuter {
      width: 360px;
      height: 9px;
      background: #15310d;
      border: 2px solid #111;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    #xpBarInner {
      height: 100%;
      width: 68%;
      background: linear-gradient(to bottom, #85ff4d 0%, #4dbd1d 100%);
    }

    /* HOTBAR */
    #hotbarWrap {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 12;
      pointer-events: auto;
    }

    .hotbar {
      display: grid;
      grid-template-columns: repeat(9, 54px);
      gap: 4px;
      padding: 4px;
      background: rgba(0,0,0,0.18);
      border-radius: 4px;
    }

    .slot {
      width: 54px;
      height: 54px;
      background: #8b8b8b;
      border-top: 4px solid #dbdbdb;
      border-left: 4px solid #dbdbdb;
      border-right: 4px solid #4e4e4e;
      border-bottom: 4px solid #4e4e4e;
      position: relative;
      cursor: pointer;
    }

    .slot.selected {
      outline: 4px solid #ffffff;
      outline-offset: 1px;
    }

    .slot.empty { background: #8f8f8f; }

    .slot-item {
      position: absolute;
      inset: 8px;
      border: 2px solid rgba(0,0,0,0.22);
    }

    .slot-count {
      position: absolute;
      right: 4px;
      bottom: 2px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
    }

    .slot-key {
      position: absolute;
      left: 4px;
      top: 2px;
      color: rgba(255,255,255,0.75);
      font-size: 11px;
      font-weight: bold;
      text-shadow: 1px 1px 0 #000;
      pointer-events: none;
    }

    /* HAND */
    #handWrap {
      position: absolute;
      right: 40px;
      bottom: 8px;
      width: 180px;
      height: 180px;
      z-index: 14;
      pointer-events: none;
      transform-origin: 85% 85%;
    }

    #handWrap.swing {
      animation: handSwing 0.18s ease-out;
    }

    .hand-sleeve {
      position: absolute;
      right: 52px;
      bottom: 22px;
      width: 58px;
      height: 78px;
      background: #1f4ab8;
      border: 3px solid rgba(0,0,0,0.25);
      transform: rotate(18deg);
    }

    .hand-skin {
      position: absolute;
      right: 20px;
      bottom: 0;
      width: 82px;
      height: 74px;
      background: #8d5a3b;
      border: 3px solid rgba(0,0,0,0.25);
      transform: rotate(18deg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.04);
    }

    @keyframes handSwing {
      0%   { transform: rotate(0deg) translateY(0); }
      35%  { transform: rotate(24deg) translateY(8px); }
      100% { transform: rotate(0deg) translateY(0); }
    }

    /* INVENTORY SCREEN */
    #inventoryScreen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.28);
      z-index: 30;
    }

    #inventoryScreen.show {
      display: flex;
    }

    .inv-panel {
      width: 760px;
      max-width: calc(100vw - 24px);
      background: #c6c6c6;
      border-top: 4px solid #ffffff;
      border-left: 4px solid #ffffff;
      border-right: 4px solid #555555;
      border-bottom: 4px solid #555555;
      padding: 14px;
      color: #111;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.35);
      position: relative;
    }

    .inv-top {
      display: grid;
      grid-template-columns: 60px 240px 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .armor-col {
      display: grid;
      grid-template-rows: repeat(4, 56px);
      gap: 8px;
    }

    .preview-box {
      height: 240px;
      background: #111;
      border-top: 4px solid #555;
      border-left: 4px solid #555;
      border-right: 4px solid #fff;
      border-bottom: 4px solid #fff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .steve {
      position: relative;
      width: 96px;
      height: 180px;
    }

    .px { position: absolute; }
    .head { left: 24px; top: 0; width: 48px; height: 48px; background: #7b4c2e; }
    .hair { left: 24px; top: 0; width: 48px; height: 14px; background: #3e2616; }
    .eye1, .eye2 { width: 8px; height: 8px; background: #66c6ff; top: 20px; }
    .eye1 { left: 34px; } .eye2 { left: 54px; }
    .body { left: 20px; top: 50px; width: 56px; height: 62px; background: #1fb8c2; }
    .armL, .armR { width: 18px; height: 62px; background: #8d5a3b; top: 52px; }
    .armL { left: 0; } .armR { right: 0; }
    .legL, .legR { width: 22px; height: 62px; background: #2f2a8a; top: 114px; }
    .legL { left: 24px; } .legR { left: 50px; }
    .shoeL, .shoeR { width: 22px; height: 8px; background: #3a3a3a; top: 168px; }
    .shoeL { left: 24px; } .shoeR { left: 50px; }

    .craft-wrap {
      display: grid;
      grid-template-columns: auto 36px 56px;
      gap: 16px;
      align-items: start;
    }

    .craft-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .craft-grid {
      display: grid;
      grid-template-columns: repeat(2, 56px);
      gap: 6px;
    }

    .craft-arrow {
      font-size: 42px;
      font-weight: bold;
      color: #8a8a8a;
      align-self: center;
      margin-top: 40px;
    }

    .recipe-btn {
      width: 56px;
      height: 56px;
      background: #d8d8d8;
      border-top: 4px solid #dbdbdb;
      border-left: 4px solid #dbdbdb;
      border-right: 4px solid #4e4e4e;
      border-bottom: 4px solid #4e4e4e;
      position: absolute;
      right: 14px;
      top: 184px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .inv-section-title {
      font-size: 18px;
      font-weight: bold;
      margin: 6px 0 8px;
      color: #333;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(9, 56px);
      gap: 6px;
      justify-content: start;
    }

    .inv-main {
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .inv-bottom {
      margin-top: 8px;
    }

    .inv-slot {
      width: 56px;
      height: 56px;
      background: #8f8f8f;
      border-top: 4px solid #555;
      border-left: 4px solid #555;
      border-right: 4px solid #fff;
      border-bottom: 4px solid #fff;
      position: relative;
      cursor: pointer;
    }

    .inv-slot.active-hotbar {
      outline: 4px solid #ffffff;
      outline-offset: 1px;
    }

    .inv-help {
      margin-top: 10px;
      font-size: 13px;
      color: #333;
      line-height: 1.5;
    }

    .drop-hover {
      outline: 3px solid #ffd54a;
      outline-offset: -2px;
    }

    #cursorItem {
      position: fixed;
      width: 56px;
      height: 56px;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      display: none;
    }

    @media (max-width: 900px) {
      .title { font-size: 58px; }
      .subtitle { font-size: 24px; }
      .splash { font-size: 18px; right: -70px; top: 28px; }
      .menu { width: calc(100% - 24px); transform: translate(-50%, -36%); }
      .mc-btn { height: 64px; font-size: 22px; }
      .inv-panel {
        transform: scale(0.85);
        transform-origin: center;
      }
      #hudTop, #xpBarOuter { width: 300px; }
    }

    @media (max-width: 640px) {
      .menu-row { grid-template-columns: 1fr; }
      .title { font-size: 42px; }
      .subtitle { font-size: 18px; }
      .splash { display: none; }
    }
  </style>
</head>
<body>
  <div id="lobby">
    <div class="lobby-screen">
      <div class="title-wrap">
        <div class="title">MINECRAFT</div>
        <div class="subtitle">JAVA EDITION</div>
        <div class="splash">HUD Lower!</div>
      </div>

      <div class="menu">
        <div class="menu-stack">
          <button class="mc-btn" id="singleBtn">싱글플레이</button>
          <button class="mc-btn" id="multiBtn">멀티플레이</button>
          <button class="mc-btn realms" id="realmsBtn">Minecraft Realms</button>
          <div class="menu-row">
            <button class="mc-btn" id="settingsBtn">설정...</button>
            <button class="mc-btn" id="quitBtn">게임 종료</button>
          </div>
        </div>
      </div>

      <div class="bottom-left">Minecraft 26.1</div>
      <div class="bottom-right">Optimized HUD Prototype</div>

      <div class="panel" id="modal">
        <div class="dialog">
          <div class="dialog-title" id="modalTitle">안내</div>
          <div class="dialog-text" id="modalText">내용</div>
          <div class="dialog-actions">
            <button class="mc-btn small-btn" id="confirmBtn">확인</button>
            <button class="mc-btn small-btn" id="cancelBtn">닫기</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="gameRoot">
    <div id="crosshair"></div>
    <div id="pauseHint">E: 인벤토리 / 1~9: 핫바 / 좌클릭: 전체 이동 / 우클릭: 반 나누기·1개 놓기 / ESC: 닫기 또는 메인 화면</div>
    <div id="perfInfo"></div>

    <div id="hudWrap">
      <div id="hudTop">
        <div id="hearts" class="hud-icons"></div>
        <div id="hunger" class="hud-icons"></div>
      </div>
      <div id="xpLevel">7</div>
      <div id="xpBarOuter">
        <div id="xpBarInner"></div>
      </div>
    </div>

    <div id="hotbarWrap">
      <div id="hotbar" class="hotbar"></div>
    </div>

    <div id="handWrap">
      <div class="hand-sleeve"></div>
      <div class="hand-skin"></div>
    </div>

    <div id="inventoryScreen">
      <div class="inv-panel">
        <div class="inv-top">
          <div class="armor-col">
            <div class="inv-slot"></div>
            <div class="inv-slot"></div>
            <div class="inv-slot"></div>
            <div class="inv-slot"></div>
          </div>

          <div class="preview-box">
            <div class="steve">
              <div class="px head"></div>
              <div class="px hair"></div>
              <div class="px eye1"></div>
              <div class="px eye2"></div>
              <div class="px body"></div>
              <div class="px armL"></div>
              <div class="px armR"></div>
              <div class="px legL"></div>
              <div class="px legR"></div>
              <div class="px shoeL"></div>
              <div class="px shoeR"></div>
            </div>
            <div class="recipe-btn">📗</div>
          </div>

          <div>
            <div class="craft-title">Crafting</div>
            <div class="craft-wrap">
              <div class="craft-grid">
                <div class="inv-slot"></div>
                <div class="inv-slot"></div>
                <div class="inv-slot"></div>
                <div class="inv-slot"></div>
              </div>
              <div class="craft-arrow">→</div>
              <div class="inv-slot"></div>
            </div>
          </div>
        </div>

        <div class="inv-section-title">Inventory</div>
        <div id="inventoryMain" class="inventory-grid inv-main"></div>

        <div class="inv-section-title">Hotbar</div>
        <div id="inventoryHotbar" class="inventory-grid inv-bottom"></div>

        <div class="inv-help">
          좌클릭: 전체 스택 집기/옮기기/자리 바꾸기<br>
          우클릭: 반 나누기 / 1개씩 놓기 / 같은 아이템 칸에 1개 추가
        </div>
      </div>
    </div>
  </div>

  <div id="cursorItem"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const lobby = document.getElementById('lobby');
    const gameRoot = document.getElementById('gameRoot');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const confirmBtn = document.getElementById('confirmBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const perfInfo = document.getElementById('perfInfo');
    const hotbarEl = document.getElementById('hotbar');
    const inventoryScreen = document.getElementById('inventoryScreen');
    const inventoryMainEl = document.getElementById('inventoryMain');
    const inventoryHotbarEl = document.getElementById('inventoryHotbar');
    const crosshair = document.getElementById('crosshair');
    const cursorItemEl = document.getElementById('cursorItem');
    const heartsEl = document.getElementById('hearts');
    const hungerEl = document.getElementById('hunger');
    const xpBarInnerEl = document.getElementById('xpBarInner');
    const xpLevelEl = document.getElementById('xpLevel');
    const handWrap = document.getElementById('handWrap');

    let confirmAction = null;

    function openModal(title, text, onConfirm = null) {
      modalTitle.textContent = title;
      modalText.textContent = text;
      confirmAction = onConfirm;
      modal.classList.add('show');
    }

    function closeModal() {
      modal.classList.remove('show');
      confirmAction = null;
    }

    confirmBtn.addEventListener('click', () => {
      if (confirmAction) confirmAction();
      closeModal();
    });

    cancelBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('multiBtn').addEventListener('click', () => {
      openModal('멀티플레이', '이번 버전은 싱글플레이 테스트용이다.');
    });

    document.getElementById('realmsBtn').addEventListener('click', () => {
      openModal('Minecraft Realms', 'Realms는 나중에 붙이면 된다.');
    });

    document.getElementById('settingsBtn').addEventListener('click', () => {
      openModal('설정', '설정 메뉴는 다음 단계에서 붙이면 된다.');
    });

    document.getElementById('quitBtn').addEventListener('click', () => {
      openModal('게임 종료', '브라우저에서는 탭을 닫으면 된다.');
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 40, 150);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      900
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: false,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(1);
    document.body.appendChild(renderer.domElement);

    const controls = new PointerLockControls(camera, document.body);

    function normalizeSlot(index) {
      const slot = inventorySlots[index];
      if (!slot.type || slot.count <= 0) {
        slot.type = null;
        slot.count = 0;
      }
    }

    function setSlot(index, type, count) {
      inventorySlots[index].type = type;
      inventorySlots[index].count = count;
      normalizeSlot(index);
    }

    function clearSlot(index) {
      inventorySlots[index].type = null;
      inventorySlots[index].count = 0;
    }

    function getSlot(index) {
      return inventorySlots[index];
    }

    function cloneStack(stack) {
      return stack ? { type: stack.type, count: stack.count } : null;
    }

    function ensureCursorNormalized() {
      if (cursorStack && cursorStack.count <= 0) {
        cursorStack = null;
      }
    }

    function findStackableSlot(type) {
      return inventorySlots.findIndex(s => s.type === type && s.count < MAX_STACK);
    }

    function findEmptySlot(preferMain = true) {
      if (preferMain) {
        for (let i = 0; i < 27; i++) {
          if (!inventorySlots[i].type) return i;
        }
      }
      for (let i = 0; i < 36; i++) {
        if (!inventorySlots[i].type) return i;
      }
      return -1;
    }

    function addItemToInventory(type, amount = 1) {
      let left = amount;
      while (left > 0) {
        let idx = findStackableSlot(type);
        if (idx === -1) idx = findEmptySlot(true);
        if (idx === -1) return;

        const slot = inventorySlots[idx];
        if (!slot.type) {
          const add = Math.min(MAX_STACK, left);
          setSlot(idx, type, add);
          left -= add;
        } else {
          const space = MAX_STACK - slot.count;
          const add = Math.min(space, left);
          slot.count += add;
          left -= add;
          normalizeSlot(idx);
        }
      }
    }

    function removeOneFromSelectedHotbar() {
      const slot = getSlot(selectedHotbarIndex);
      if (!slot.type || slot.count <= 0) return false;
      slot.count -= 1;
      normalizeSlot(selectedHotbarIndex);
      return true;
    }

    function getSelectedBlockType() {

      if (!slot.type || slot.count <= 0) return null;

      setSlot(28, 'dirt', 64);
      setSlot(29, 'stone', 64);
      setSlot(30, 'sand', 64);
      setSlot(31, 'log', 32);
      setSlot(32, 'leaves', 32);
      setSlot(33, 'coal', 16);
      setSlot(34, 'iron', 12);
      setSlot(35, 'diamond', 8);
    }
    seedInventory();

    function createItemVisual(type, count) {

    function updateCursorItemVisual() {

      cursorItemEl.style.display = 'block';

    function moveCursorVisual(x, y) {

    function renderHotbar() {
      hotbarEl.innerHTML = '';

        const slotIndex = HOTBAR_START + i;
        const slot = getSlot(slotIndex);

        const div = document.createElement('div');

        div.dataset.slotIndex = String(slotIndex);

        div.innerHTML = `

        div.addEventListener('click', (e) => {
          if (cursorStack) return;
          if (e.button !== 0) return;
          selectedHotbarIndex = slotIndex;

        div.addEventListener('mousedown', (e) => handleSlotMouseDown(e, slotIndex));

    function createInventorySlot(index, isHotbar = false) {
      const slot = getSlot(index);
      const div = document.createElement('div');
      div.className = `inv-slot ${index === selectedHotbarIndex ? 'active-hotbar' : ''} ${hoverSlotIndex === index ? 'drop-hover' : ''}`;
      div.dataset.slotIndex = String(index);

      div.innerHTML = createItemVisual(slot.type, slot.count);

      div.addEventListener('click', (e) => {
        if (cursorStack) return;
        if (e.button !== 0) return;
        if (isHotbar) {
          selectedHotbarIndex = index;
          renderHotbar();
          renderInventory();
        }
      });

      div.addEventListener('mousedown', (e) => handleSlotMouseDown(e, index));
      return div;
    }

    function renderInventory() {
      inventoryMainEl.innerHTML = '';
      inventoryHotbarEl.innerHTML = '';

      for (let i = 0; i < 27; i++) {
        inventoryMainEl.appendChild(createInventorySlot(i, false));
      }

      for (let i = 27; i < 36; i++) {
        inventoryHotbarEl.appendChild(createInventorySlot(i, true));
      }
    }

    function rerenderInventoryUI() {
      renderHotbar();
      if (inventoryOpen) renderInventory();
      updateCursorItemVisual();
      renderFunHud();
    }

    function openInventory() {
      inventoryOpen = true;
      inventoryScreen.classList.add('show');
      crosshair.classList.add('hidden');
      controls.unlock();
      renderInventory();
      renderHotbar();
    }

    function closeInventory() {
      inventoryOpen = false;
      inventoryScreen.classList.remove('show');
      crosshair.classList.remove('hidden');
      hoverSlotIndex = null;

      if (cursorStack && dragOriginIndex !== null) {
        const origin = getSlot(dragOriginIndex);
        if (!origin.type) {
          setSlot(dragOriginIndex, cursorStack.type, cursorStack.count);
          cursorStack = null;
        } else if (origin.type === cursorStack.type && origin.count < MAX_STACK) {
          const add = Math.min(MAX_STACK - origin.count, cursorStack.count);
          origin.count += add;
          cursorStack.count -= add;
          ensureCursorNormalized();
        }
      }

      if (cursorStack) {
        addItemToInventory(cursorStack.type, cursorStack.count);
        cursorStack = null;
      }

      dragOriginIndex = null;
      rerenderInventoryUI();
    }

    function toggleInventory() {
      if (!gameStarted) return;
      if (inventoryOpen) closeInventory();
      else openInventory();
    }

    function pickUpWholeStack(index) {
      const slot = getSlot(index);
      if (!slot.type || slot.count <= 0) return;
      cursorStack = { type: slot.type, count: slot.count };
      dragOriginIndex = index;
      clearSlot(index);
    }

    function pickUpHalfStack(index) {
      const slot = getSlot(index);
      if (!slot.type || slot.count <= 0) return;
      const take = Math.ceil(slot.count / 2);
      const leave = slot.count - take;

      cursorStack = { type: slot.type, count: take };
      dragOriginIndex = index;

      if (leave <= 0) clearSlot(index);
      else setSlot(index, slot.type, leave);
    }

    function placeWholeToEmpty(targetIndex) {
      if (!cursorStack) return;
      setSlot(targetIndex, cursorStack.type, cursorStack.count);
      cursorStack = null;
      dragOriginIndex = null;
    }

    function mergeWholeToSameType(targetIndex) {
      const slot = getSlot(targetIndex);
      if (!cursorStack || slot.type !== cursorStack.type) return false;

      const space = MAX_STACK - slot.count;
      if (space <= 0) return false;

      const add = Math.min(space, cursorStack.count);
      slot.count += add;
      cursorStack.count -= add;
      ensureCursorNormalized();

      if (!cursorStack) dragOriginIndex = null;
      return true;
    }

    function swapWithTarget(targetIndex) {
      const target = cloneStack(getSlot(targetIndex));
      const originIndex = dragOriginIndex;

      setSlot(targetIndex, cursorStack.type, cursorStack.count);

      if (originIndex !== null) {
        if (target && target.type) setSlot(originIndex, target.type, target.count);
        else clearSlot(originIndex);
      }

      cursorStack = null;
      dragOriginIndex = null;
    }

    function returnCursorToOriginOrInventory() {
      if (!cursorStack) return;

      if (dragOriginIndex !== null) {
        const origin = getSlot(dragOriginIndex);

        if (!origin.type) {
          setSlot(dragOriginIndex, cursorStack.type, cursorStack.count);
          cursorStack = null;
          dragOriginIndex = null;
          return;
        }

        if (origin.type === cursorStack.type && origin.count < MAX_STACK) {
          const add = Math.min(MAX_STACK - origin.count, cursorStack.count);
          origin.count += add;
          cursorStack.count -= add;
          ensureCursorNormalized();
          if (!cursorStack) {
            dragOriginIndex = null;
            return;
          }
        }
      }

      if (cursorStack) {
        addItemToInventory(cursorStack.type, cursorStack.count);
        cursorStack = null;
        dragOriginIndex = null;
      }
    }

    function handleLeftDrop(targetIndex) {
      if (!cursorStack) return;

      if (targetIndex === null) {
        returnCursorToOriginOrInventory();
        return;
      }

      const target = getSlot(targetIndex);

      if (!target.type) {
        placeWholeToEmpty(targetIndex);
        return;
      }

      if (target.type === cursorStack.type) {
        mergeWholeToSameType(targetIndex);
        if (cursorStack) returnCursorToOriginOrInventory();
        return;
      }

      swapWithTarget(targetIndex);
    }

    function handleRightClickSlot(index) {
      const slot = getSlot(index);

      if (!cursorStack) {
        if (!slot.type || slot.count <= 0) return;

        if (slot.count === 1) {
          cursorStack = { type: slot.type, count: 1 };
          dragOriginIndex = index;
          clearSlot(index);
        } else {
          pickUpHalfStack(index);
        }
        return;
      }

      if (!slot.type) {
        setSlot(index, cursorStack.type, 1);
        cursorStack.count -= 1;
        ensureCursorNormalized();
        return;
      }

      if (slot.type === cursorStack.type && slot.count < MAX_STACK) {
        slot.count += 1;
        cursorStack.count -= 1;
        ensureCursorNormalized();
      }
    }

    function handleSlotMouseDown(e, index) {
      if (!inventoryOpen) return;

      e.preventDefault();
      e.stopPropagation();

      const slot = getSlot(index);

      if (e.button === 0) {
        if (!cursorStack) {
          if (!slot.type) return;
          pickUpWholeStack(index);
        }
      } else if (e.button === 2) {
        handleRightClickSlot(index);
      }

      rerenderInventoryUI();
      moveCursorVisual(e.clientX, e.clientY);
    }

    function getSlotIndexFromPoint(x, y) {
      const el = document.elementFromPoint(x, y);
      if (!el) return null;
      const slotEl = el.closest('[data-slot-index]');
      if (!slotEl) return null;
      const idx = Number(slotEl.dataset.slotIndex);
      return Number.isFinite(idx) ? idx : null;
    }

    document.addEventListener('mousemove', (e) => {
      moveCursorVisual(e.clientX, e.clientY);

      if (inventoryOpen) {
        const idx = getSlotIndexFromPoint(e.clientX, e.clientY);
        if (hoverSlotIndex !== idx) {
          hoverSlotIndex = idx;
          rerenderInventoryUI();
        }
      }
    });

    document.addEventListener('mouseup', (e) => {
      if (!inventoryOpen) return;

      const targetIndex = getSlotIndexFromPoint(e.clientX, e.clientY);

      if (e.button === 0 && cursorStack) {
        handleLeftDrop(targetIndex);
        hoverSlotIndex = null;
        rerenderInventoryUI();

    document.addEventListener('contextmenu', (e) => {
      if (inventoryOpen) e.preventDefault();
    });

    const chunks = new Map();
    const modifiedBlocks = new Map();
    const cloudChunks = new Map();

    let currentChunkX = null;
    let currentChunkZ = null;
    let gameStarted = false;

    function blockKey(x, y, z) {
      return `${x},${y},${z}`;
    }

    function chunkKey(cx, cz) {
      return `${cx},${cz}`;
    }

    function floorDiv(n, size) {
      return Math.floor(n / size);
    }

    function hash2D(x, z) {
      let h = x * 374761393 + z * 668265263;
      h = (h ^ (h >> 13)) * 1274126177;
      return ((h ^ (h >> 16)) >>> 0) / 4294967295;
    }

    function hash3D(x, y, z) {
      let h = x * 374761393 + y * 1274126177 + z * 668265263;
      h = (h ^ (h >> 13)) * 1274126177;
      return ((h ^ (h >> 16)) >>> 0) / 4294967295;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function smoothstep(t) {
      return t * t * (3 - 2 * t);
    }

    function valueNoise(x, z) {
      const x0 = Math.floor(x);
      const z0 = Math.floor(z);
      const x1 = x0 + 1;
      const z1 = z0 + 1;

      const sx = smoothstep(x - x0);
      const sz = smoothstep(z - z0);

      const n00 = hash2D(x0, z0);
      const n10 = hash2D(x1, z0);
      const n01 = hash2D(x0, z1);
      const n11 = hash2D(x1, z1);

      const ix0 = lerp(n00, n10, sx);
      const ix1 = lerp(n01, n11, sx);

      return lerp(ix0, ix1, sz) * 2 - 1;
    }

    function fbm(x, z) {
      let total = 0;
      let amplitude = 1;
      let frequency = 1;
      let maxValue = 0;

      for (let i = 0; i < 4; i++) {
        total += valueNoise(x * frequency, z * frequency) * amplitude;
        maxValue += amplitude;
        amplitude *= 0.5;
        frequency *= 2;
      }
      return total / maxValue;
    }

    function getTerrainHeight(x, z) {
      const n1 = fbm(x * 0.03, z * 0.03);
      const n2 = fbm(x * 0.008, z * 0.008);
      const hill = n1 * 6;
      const continent = n2 * 8;
      return Math.floor(continent + hill + 10);
    }

    function isTreeBase(x, z) {
      const surfaceY = getTerrainHeight(x, z);
      if (surfaceY < 7) return false;

      const r = hash2D(x * 31 + 7, z * 17 + 13);
      if (r >= TREE_CHANCE) return false;

      for (let ox = -TREE_MIN_DISTANCE; ox <= TREE_MIN_DISTANCE; ox++) {
        for (let oz = -TREE_MIN_DISTANCE; oz <= TREE_MIN_DISTANCE; oz++) {
          if (ox === 0 && oz === 0) continue;
          const dist = Math.abs(ox) + Math.abs(oz);
          if (dist > TREE_MIN_DISTANCE) continue;

          const nr = hash2D((x + ox) * 31 + 7, (z + oz) * 17 + 13);
          if (nr < TREE_CHANCE) {
            if (nr < r) return false;
            if (nr === r && (ox < 0 || (ox === 0 && oz < 0))) return false;
          }
        }
      }

      return true;
    }

    function getTerrainBlockType(x, y, z) {
      const h = getTerrainHeight(x, z);
      if (y > h) return null;

      if (y === h) return 'grass';
      if (y >= h - 3) return 'dirt';

      if (y < -10) {
        const r = hash3D(x * 7, y * 13, z * 11);
        if (r < 0.008 && y < -18) return 'diamond';
        if (r < 0.02 && y < -14) return 'iron';
        if (r < 0.05) return 'coal';
        return 'deepslate';
      }

      if (h <= 4 && y >= h - 1) return 'sand';
      return 'stone';
    }

    function getDecorativeBlockType(x, y, z) {
      for (let ox = -3; ox <= 3; ox++) {
        for (let oz = -3; oz <= 3; oz++) {
          const tx = x - ox;
          const tz = z - oz;

          if (!isTreeBase(tx, tz)) continue;

          const treeBaseY = getTerrainHeight(tx, tz);
          const trunkHeight = 4 + Math.floor(hash2D(tx * 19, tz * 23) * 3);
          const topY = treeBaseY + trunkHeight;

          if (x === tx && z === tz) {
            if (y >= treeBaseY + 1 && y <= topY) return 'log';
          }

          const leafBottom = topY - 2;
          const leafTop = topY + 1;

          if (y >= leafBottom && y <= leafTop) {
            const radius = (y === leafTop) ? 1 : 2;
            const dx = x - tx;
            const dz = z - tz;

            if (Math.abs(dx) <= radius && Math.abs(dz) <= radius) {
              if (!(dx === 0 && dz === 0 && y <= topY)) {
                if (!(Math.abs(dx) === radius && Math.abs(dz) === radius && y !== leafTop)) {
                  return 'leaves';
                }
              }
            }
          }
        }
      }

      return null;
    }

    function getBlockTypeAt(x, y, z) {
      const key = blockKey(x, y, z);
      if (modifiedBlocks.has(key)) return modifiedBlocks.get(key);

      const deco = getDecorativeBlockType(x, y, z);
      if (deco) return deco;

      return getTerrainBlockType(x, y, z);
    }

    function isSolidBlockAt(x, y, z) {
      return getBlockTypeAt(x, y, z) !== null;
    }

    function isBlockVisible(x, y, z) {
      return (
        !isSolidBlockAt(x + 1, y, z) ||
        !isSolidBlockAt(x - 1, y, z) ||
        !isSolidBlockAt(x, y + 1, z) ||
        !isSolidBlockAt(x, y - 1, z) ||
        !isSolidBlockAt(x, y, z + 1) ||
        !isSolidBlockAt(x, y, z - 1)
      );
    }

    function createCloudChunk(cx, cz) {
      return { cx, cz, group: new THREE.Group() };
    }

    function disposeCloudChunk(chunk) {
      if (!chunk) return;
      scene.remove(chunk.group);
    }

    function addCloudPatch(points, baseX, baseY, baseZ, w, h, d) {
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          for (let z = 0; z < d; z++) {
            points.push({ x: baseX + x, y: baseY + y, z: baseZ + z });
          }
        }
      }
    }

    function buildCloudChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      const old = cloudChunks.get(key);
      if (old) disposeCloudChunk(old);

      const cloudChunk = createCloudChunk(cx, cz);
      const points = [];
      const startX = cx * CHUNK_SIZE;
      const startZ = cz * CHUNK_SIZE;

      const cloudCountRand = hash2D(cx * 101 + 17, cz * 97 + 43);
      let cloudCount = 0;
      if (cloudCountRand < 0.35) cloudCount = 0;
      else if (cloudCountRand < 0.8) cloudCount = 1;
      else cloudCount = 2;

      for (let i = 0; i < cloudCount; i++) {
        const ox = Math.floor(hash2D(cx * 11 + i * 31, cz * 17 + i * 13) * CHUNK_SIZE);
        const oz = Math.floor(hash2D(cx * 23 + i * 19, cz * 29 + i * 37) * CHUNK_SIZE);
        const oy = CLOUD_Y_MIN + Math.floor(hash2D(cx * 41 + i * 7, cz * 53 + i * 5) * (CLOUD_Y_MAX - CLOUD_Y_MIN + 1));

        const x = startX + ox;
        const z = startZ + oz;
        const shape = Math.floor(hash2D(cx * 61 + i * 3, cz * 71 + i * 9) * 3);

        if (shape === 0) {
          addCloudPatch(points, x, oy, z, 5, 1, 3);
          addCloudPatch(points, x + 1, oy, z - 1, 3, 1, 5);
        } else if (shape === 1) {
          addCloudPatch(points, x, oy, z, 6, 1, 2);
          addCloudPatch(points, x + 1, oy + 1, z, 3, 1, 2);
        } else {
          addCloudPatch(points, x, oy, z, 4, 1, 4);
          addCloudPatch(points, x + 1, oy + 1, z + 1, 2, 1, 2);
        }
      }

      if (points.length > 0) {
        const mesh = new THREE.InstancedMesh(boxGeo, cloudMaterial, points.length);
        mesh.frustumCulled = true;
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          dummy.position.set(p.x, p.y, p.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
        }
        mesh.instanceMatrix.needsUpdate = true;
        cloudChunk.group.add(mesh);
      }

      scene.add(cloudChunk.group);
      cloudChunks.set(key, cloudChunk);
    }

    function updateCloudChunks() {
      const cx = floorDiv(camera.position.x, CHUNK_SIZE);
      const cz = floorDiv(camera.position.z, CHUNK_SIZE);
      const needed = new Set();

      for (let dx = -CLOUD_RENDER_RADIUS; dx <= CLOUD_RENDER_RADIUS; dx++) {
        for (let dz = -CLOUD_RENDER_RADIUS; dz <= CLOUD_RENDER_RADIUS; dz++) {
          const nx = cx + dx;
          const nz = cz + dz;
          const key = chunkKey(nx, nz);
          needed.add(key);
          if (!cloudChunks.has(key)) buildCloudChunk(nx, nz);
        }
      }

      for (const key of Array.from(cloudChunks.keys())) {
        if (!needed.has(key)) {
          const chunk = cloudChunks.get(key);
          disposeCloudChunk(chunk);
          cloudChunks.delete(key);
        }
      }
    }

    function createChunk(cx, cz) {
      return {
        cx,
        cz,
        group: new THREE.Group(),
        meshesByType: new Map(),
        instanceMeta: new Map(),
        visibleCount: 0
      };
    }

    function disposeChunk(chunk) {
      if (!chunk) return;
      scene.remove(chunk.group);
    }

    function rebuildChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      const oldChunk = chunks.get(key);
      if (oldChunk) disposeChunk(oldChunk);

      const chunk = createChunk(cx, cz);
      const startX = cx * CHUNK_SIZE;
      const startZ = cz * CHUNK_SIZE;

      const visibleByType = new Map();
      for (const type of BLOCK_TYPES) visibleByType.set(type, []);

      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        for (let lz = 0; lz < CHUNK_SIZE; lz++) {
          const x = startX + lx;
          const z = startZ + lz;
          const h = getTerrainHeight(x, z);
          const maxY = h + WORLD_TOP_BUFFER;

          for (let y = WORLD_BOTTOM; y <= maxY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;
            if (!isBlockVisible(x, y, z)) continue;
            visibleByType.get(type).push({ x, y, z });
            chunk.visibleCount++;
          }
        }
      }

      for (const type of BLOCK_TYPES) {
        const list = visibleByType.get(type);
        if (!list.length) continue;

        const mesh = new THREE.InstancedMesh(boxGeo, materials[type], list.length);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.frustumCulled = true;
        mesh.userData.blockType = type;
        mesh.userData.chunkKey = key;

        const meta = new Array(list.length);

        for (let i = 0; i < list.length; i++) {
          const b = list[i];
          dummy.position.set(b.x, b.y, b.z);
          dummy.rotation.set(0, 0, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
          meta[i] = { x: b.x, y: b.y, z: b.z, type };
        }

        mesh.instanceMatrix.needsUpdate = true;
        chunk.meshesByType.set(type, mesh);
        chunk.instanceMeta.set(mesh, meta);
        chunk.group.add(mesh);
      }

      scene.add(chunk.group);
      chunks.set(key, chunk);
    }

    function loadChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      if (chunks.has(key)) return;
      rebuildChunk(cx, cz);
    }

    function unloadChunk(cx, cz) {
      const key = chunkKey(cx, cz);
      const chunk = chunks.get(key);
      if (!chunk) return;
      disposeChunk(chunk);
      chunks.delete(key);
    }

    function rebuildChunkAndNeighborsByBlock(x, z) {
      const cx = floorDiv(x, CHUNK_SIZE);
      const cz = floorDiv(z, CHUNK_SIZE);

      rebuildChunk(cx, cz);

      const localX = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
      const localZ = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;

      if (localX === 0) rebuildChunk(cx - 1, cz);
      if (localX === CHUNK_SIZE - 1) rebuildChunk(cx + 1, cz);
      if (localZ === 0) rebuildChunk(cx, cz - 1);
      if (localZ === CHUNK_SIZE - 1) rebuildChunk(cx, cz + 1);
    }

    function updateChunks(force = false) {
      const cx = floorDiv(camera.position.x, CHUNK_SIZE);
      const cz = floorDiv(camera.position.z, CHUNK_SIZE);

      if (!force && cx === currentChunkX && cz === currentChunkZ) {
        updateCloudChunks();
        return;
      }

      currentChunkX = cx;
      currentChunkZ = cz;

      const needed = new Set();

      for (let dx = -RENDER_DISTANCE; dx <= RENDER_DISTANCE; dx++) {
        for (let dz = -RENDER_DISTANCE; dz <= RENDER_DISTANCE; dz++) {
          const nx = cx + dx;
          const nz = cz + dz;
          const key = chunkKey(nx, nz);
          needed.add(key);
          loadChunk(nx, nz);
        }
      }

      for (const key of Array.from(chunks.keys())) {
        if (!needed.has(key)) {
          const [ux, uz] = key.split(',').map(Number);
          unloadChunk(ux, uz);
        }
      }

      updateCloudChunks();
    }

    function getFeetY(pos) {
      return pos.y - PLAYER_EYE_HEIGHT;
    }

    function setFeetY(pos, feetY) {
      pos.y = feetY + PLAYER_EYE_HEIGHT;
    }

    function playerBoxAt(pos) {
      const feetY = getFeetY(pos);
      return {
        minX: pos.x - PLAYER_HALF,
        maxX: pos.x + PLAYER_HALF,
        minY: feetY,
        maxY: feetY + PLAYER_HEIGHT,
        minZ: pos.z - PLAYER_HALF,
        maxZ: pos.z + PLAYER_HALF
      };
    }

    function blockBox(x, y, z) {
      return {
        minX: x - 0.5,
        maxX: x + 0.5,
        minY: y - 0.5,
        maxY: y + 0.5,
        minZ: z - 0.5,
        maxZ: z + 0.5
      };
    }

    function intersects(a, b) {
      return (
        a.minX < b.maxX && a.maxX > b.minX &&
        a.minY < b.maxY && a.maxY > b.minY &&
        a.minZ < b.maxZ && a.maxZ > b.minZ
      );
    }

    function collidesAt(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minY = Math.floor(pBox.minY);
      const maxY = Math.floor(pBox.maxY);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;
            const bBox = blockBox(x, y, z);
            if (intersects(pBox, bBox)) return true;
          }
        }
      }
      return false;
    }

    function isPlacementInsidePlayer(pos) {
      const pBox = playerBoxAt(camera.position);
      const bBox = blockBox(pos.x, pos.y, pos.z);
      return intersects(pBox, bBox);
    }

    function getFloorY(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);
      const startY = Math.floor(pBox.minY) - 3;
      const endY = Math.floor(pBox.minY) + 1;

      let bestTop = -Infinity;

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = startY; y <= endY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;

            const bb = blockBox(x, y, z);
            const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
            const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

            if (!overlapX || !overlapZ) continue;
            if (bb.maxY <= pBox.minY + 0.2 && bb.maxY > bestTop) bestTop = bb.maxY;
          }
        }
      }

      return bestTop;
    }

    function getCeilingY(pos) {
      const pBox = playerBoxAt(pos);
      const minX = Math.floor(pBox.minX);
      const maxX = Math.floor(pBox.maxX);
      const minZ = Math.floor(pBox.minZ);
      const maxZ = Math.floor(pBox.maxZ);
      const startY = Math.floor(pBox.maxY) - 1;
      const endY = Math.floor(pBox.maxY) + 3;

      let bestBottom = Infinity;

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = startY; y <= endY; y++) {
            const type = getBlockTypeAt(x, y, z);
            if (!type) continue;

            const bb = blockBox(x, y, z);
            const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
            const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

            if (!overlapX || !overlapZ) continue;
            if (bb.minY >= pBox.maxY - 0.2 && bb.minY < bestBottom) bestBottom = bb.minY;
          }
        }
      }

      return bestBottom;
    }

    function tryMoveAxis(dx, dz, velocity) {
      if (dx !== 0) {
        const next = camera.position.clone();
        next.x += dx;

        if (!collidesAt(next)) {
          camera.position.x = next.x;
        } else {
          const step = next.clone();
          step.y += STEP_HEIGHT;
          if (!collidesAt(step)) {
            camera.position.x = next.x;
            camera.position.y = step.y;
          } else {
            velocity.x = 0;
          }
        }
      }

      if (dz !== 0) {
        const next = camera.position.clone();
        next.z += dz;

        if (!collidesAt(next)) {
          camera.position.z = next.z;
        } else {
          const step = next.clone();
          step.y += STEP_HEIGHT;
          if (!collidesAt(step)) {
            camera.position.z = next.z;
            camera.position.y = step.y;
          } else {
            velocity.z = 0;
          }
        }
      }
    }

    function resolveVertical(delta, velocity, state) {
      camera.position.y += velocity.y * delta;

      if (velocity.y > 0) {
        const ceiling = getCeilingY(camera.position);
        if (ceiling < Infinity) {
          const pBox = playerBoxAt(camera.position);
          if (pBox.maxY > ceiling) {
            const newFeet = ceiling - PLAYER_HEIGHT - EPS;
            setFeetY(camera.position, newFeet);
            velocity.y = 0;
          }
        }
      }

      const floorY = getFloorY(camera.position);
      state.canJump = false;

      if (floorY > -Infinity) {
        const feetY = getFeetY(camera.position);
        if (feetY <= floorY + 0.08 && velocity.y <= 0) {
          setFeetY(camera.position, floorY);
          velocity.y = 0;
          state.canJump = true;
        }
      }
    }

    const highlightGeo = new THREE.BoxGeometry(1.03, 1.03, 1.03);
    const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
    const highlight = new THREE.Mesh(highlightGeo, highlightMat);
    highlight.visible = false;
    scene.add(highlight);

    let currentTargetBlock = null;
    let raycastTargets = [];

    function refreshRaycastTargets() {
      raycastTargets = [];
      for (const chunk of chunks.values()) {
        for (const mesh of chunk.meshesByType.values()) {
          raycastTargets.push(mesh);
        }
      }
    }

    function updateBlockHighlight() {
      if (!gameStarted || inventoryOpen) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      raycaster.far = 8;

      const hits = raycaster.intersectObjects(raycastTargets, false);
      if (hits.length === 0) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      const hit = hits[0];
      const chunk = chunks.get(hit.object.userData.chunkKey);
      if (!chunk) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      const meta = chunk.instanceMeta.get(hit.object);
      const block = meta?.[hit.instanceId];
      if (!block) {
        highlight.visible = false;
        currentTargetBlock = null;
        return;
      }

      highlight.position.set(block.x, block.y, block.z);
      highlight.visible = true;
      currentTargetBlock = {
        x: block.x,
        y: block.y,
        z: block.z,
        type: block.type,
        faceNormal: hit.face?.normal?.clone() || new THREE.Vector3()
      };
    }

    function breakBlockAt(x, y, z, type) {
      modifiedBlocks.set(blockKey(x, y, z), null);
      addItemToInventory(type, 1);
      rebuildChunkAndNeighborsByBlock(x, z);
      refreshRaycastTargets();
      rerenderInventoryUI();
      triggerHandSwing();
    }

    function placeBlock(x, y, z, type) {
      if (isSolidBlockAt(x, y, z)) return;
      if (!removeOneFromSelectedHotbar()) return;

      modifiedBlocks.set(blockKey(x, y, z), type);
      rebuildChunkAndNeighborsByBlock(x, z);
      refreshRaycastTargets();
      rerenderInventoryUI();
      triggerHandSwing();
    }

    window.addEventListener('mousedown', (e) => {
      if (!gameStarted || !controls.isLocked || inventoryOpen) return;
      if (!currentTargetBlock) return;

      if (e.button === 0) {
        breakBlockAt(
          currentTargetBlock.x,
          currentTargetBlock.y,
          currentTargetBlock.z,
          currentTargetBlock.type
        );
        return;
      }

      if (e.button === 2) {
        const selectedType = getSelectedBlockType();
        if (!selectedType) return;

        const pos = new THREE.Vector3(
          currentTargetBlock.x,
          currentTargetBlock.y,
          currentTargetBlock.z
        ).add(currentTargetBlock.faceNormal);

        pos.x = Math.round(pos.x);
        pos.y = Math.round(pos.y);
        pos.z = Math.round(pos.z);

        if (isSolidBlockAt(pos.x, pos.y, pos.z)) return;
        if (isPlacementInsidePlayer(pos)) return;

        placeBlock(pos.x, pos.y, pos.z, selectedType);
      }
    });

    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;

    const velocity = new THREE.Vector3(0, 0, 0);
    const movementState = { canJump: false };

    function resetMovementKeys() {
      moveForward = false;
      moveBackward = false;
      moveLeft = false;
      moveRight = false;
      velocity.set(0, 0, 0);
      movementState.canJump = false;
    }

    function clearWorld() {
      for (const chunk of chunks.values()) disposeChunk(chunk);
      chunks.clear();

      for (const c of cloudChunks.values()) disposeCloudChunk(c);
      cloudChunks.clear();

      modifiedBlocks.clear();
      refreshRaycastTargets();
      highlight.visible = false;
      currentTargetBlock = null;
      currentChunkX = null;
      currentChunkZ = null;
    }

    function returnToLobby() {
      controls.unlock();
      closeInventory();
      resetMovementKeys();
      clearWorld();
      gameStarted = false;
      gameRoot.style.display = 'none';
      lobby.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('show') && e.key === 'Escape') {
        closeModal();
        return;
      }

      if (!gameStarted) return;

      if (e.code === 'KeyE') {
        toggleInventory();
        return;
      }

      if (e.key === 'Escape') {
        if (inventoryOpen) {
          closeInventory();
        } else {
          returnToLobby();
        }
        return;
      }

      const hotbarIndex = hotbarKeys.indexOf(e.key);
      if (hotbarIndex !== -1) {
        selectedHotbarIndex = HOTBAR_START + hotbarIndex;
        rerenderInventoryUI();
        return;
      }

      if (inventoryOpen) return;

      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;

      if (e.code === 'Space' && movementState.canJump) {
        velocity.y = 8.5;
        movementState.canJump = false;
      }
    });

    document.addEventListener('keyup', (e) => {
      if (!gameStarted || inventoryOpen) return;
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    function startGame() {
      lobby.style.display = 'none';
      gameRoot.style.display = 'block';
      gameStarted = true;

      const spawnX = 0;
      const spawnZ = 0;
      const terrainY = getTerrainHeight(spawnX, spawnZ);

      camera.position.set(spawnX, terrainY + PLAYER_EYE_HEIGHT + 2, spawnZ);

      currentChunkX = null;
      currentChunkZ = null;
      updateChunks(true);
      refreshRaycastTargets();

      const floorY = getFloorY(camera.position);
      if (floorY > -Infinity) {
        setFeetY(camera.position, floorY + 0.01);
      }

      closeInventory();
      rerenderInventoryUI();
      renderFunHud();
      controls.lock();
    }

    document.getElementById('singleBtn').addEventListener('click', startGame);

    let prevTime = performance.now();
    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();
    const moveDir = new THREE.Vector3();

    let fpsFrame = 0;
    let fpsTime = 0;
    let fpsValue = 0;

    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      const delta = Math.min((time - prevTime) / 1000, 0.05);

      if (gameStarted) {
        updateChunks();

        if (controls.isLocked && !inventoryOpen) {
          velocity.x *= Math.max(0, 1 - 10 * delta);
          velocity.z *= Math.max(0, 1 - 10 * delta);
          velocity.y -= 24 * delta;

          camera.getWorldDirection(forward);
          forward.y = 0;
          forward.normalize();

          right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

          moveDir.set(0, 0, 0);
          if (moveForward) moveDir.add(forward);
          if (moveBackward) moveDir.sub(forward);
          if (moveRight) moveDir.add(right);
          if (moveLeft) moveDir.sub(right);

          if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
            const accel = 30;
            velocity.x += moveDir.x * accel * delta;
            velocity.z += moveDir.z * accel * delta;
          }

          const maxSpeed = 6;
          const horizontalSpeed = Math.hypot(velocity.x, velocity.z);
          if (horizontalSpeed > maxSpeed) {
            const scale = maxSpeed / horizontalSpeed;
            velocity.x *= scale;
            velocity.z *= scale;
          }

          tryMoveAxis(velocity.x * delta, velocity.z * delta, velocity);
          resolveVertical(delta, velocity, movementState);

          if (camera.position.y < WORLD_BOTTOM - 20) {
            const x = Math.round(camera.position.x);
            const z = Math.round(camera.position.z);
            camera.position.set(x, getTerrainHeight(x, z) + PLAYER_EYE_HEIGHT + 2, z);
            velocity.set(0, 0, 0);
          }
        }

        updateBlockHighlight();

        fpsFrame++;
        fpsTime += delta;
        if (fpsTime >= 0.5) {
          fpsValue = Math.round(fpsFrame / fpsTime);
          fpsFrame = 0;
          fpsTime = 0;

          let totalVisible = 0;
          for (const c of chunks.values()) totalVisible += c.visibleCount;

          const selectedType = getSelectedBlockType();
          perfInfo.innerHTML = `
            FPS: ${fpsValue}<br>
            로드 청크: ${chunks.size}<br>
            렌더 블록: ${totalVisible.toLocaleString()}<br>
            선택 블록: ${selectedType ? BLOCK_DATA[selectedType].name : '없음'}<br>
            인벤토리: ${inventoryOpen ? '열림' : '닫힘'}
          `;
        }
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(1);
    });

    renderFunHud();
    rerenderInventoryUI();
    animate();
  </script>
</body>
</html>
