<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Minecraft - 이동 및 충돌 완벽 수정</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 15px; height: 15px;
            border: 2px solid white; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #ui {
            position: absolute; top: 10px; left: 10px; bottom: 10px;
            color: white; font-family: 'Malgun Gothic', sans-serif;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px;
            overflow-y: auto; width: 220px;
        }
        .inv-item { margin-top: 4px; padding: 6px; border-radius: 4px; font-size: 0.85em; display: flex; justify-content: space-between; }
        .active { background: rgba(0, 255, 0, 0.15); border: 1px solid #00ff00; color: #00ff00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div style="font-weight: bold; margin-bottom: 5px; text-align:center;">⛏️ 인벤토리</div>
        <div style="font-size:0.75em; color:#aaa; text-align:center; margin-bottom:10px;">화면 클릭 후 WASD로 이동</div>
        <div id="inventory-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // 1. 블록 데이터
        const BLOCK_DATA = {
            "grass": { name: "잔디", color: 0x7cfc00, key: "1" },
            "dirt":  { name: "흙", color: 0x5d4037, key: "2" },
            "stone": { name: "돌", color: 0x808080, key: "3" },
            "log": { name: "원목", color: 0x6f4e37, key: "4" },
            "leaves": { name: "나뭇잎", color: 0x228b22, key: "5" }
        };

        let inventory = { grass: 64, dirt: 64, stone: 64, log: 64, leaves: 64 };
        let selectedBlockType = "grass";

        function updateUI() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            Object.keys(BLOCK_DATA).forEach(type => {
                const div = document.createElement('div');
                div.className = `inv-item ${selectedBlockType === type ? 'active' : ''}`;
                div.innerHTML = `<span>${BLOCK_DATA[type].name}</span> <span>${inventory[type]}</span>`;
                list.appendChild(div);
            });
        }
        updateUI();

        // 2. Scene 및 카메라 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // 중요: 공중 스폰 (끼임 방지)
        camera.position.set(0, 10, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => controls.lock());

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // 3. 지형 생성
        const blocks = [];
        const blockBoxes = [];
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);

        function createBlock(x, y, z, type) {
            const mat = new THREE.MeshLambertMaterial({ color: BLOCK_DATA[type].color });
            const block = new THREE.Mesh(boxGeo, mat);
            block.position.set(x, y, z);
            block.name = type;
            scene.add(block);
            blocks.push(block);
            blockBoxes.push(new THREE.Box3().setFromObject(block));
        }

        // 지형 깔기
        for (let x = -10; x <= 10; x++) {
            for (let z = -10; z <= 10; z++) {
                createBlock(x, 0, z, 'grass');
                createBlock(x, -1, z, 'dirt');
            }
        }

        // 4. 이동 로직
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const playerBox = new THREE.Box3();
        const playerSize = new THREE.Vector3(0.5, 1.7, 0.5); // 약간 작게 설정해서 이동 원활하게

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyD') moveRight = true;
            if (e.code === 'Space' && canJump) { velocity.y += 8; canJump = false; }
            if (["1","2","3","4","5"].includes(e.key)) {
                selectedBlockType = Object.keys(BLOCK_DATA)[parseInt(e.key)-1];
                updateUI();
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        let prevTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            
            if (controls.isLocked) {
                const delta = (time - prevTime) / 1000;
                
                // 속도 감쇠
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.5 * delta; 

                // 입력 처리
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                // --- 충돌 감지 로직 ---
                const oldPos = camera.position.clone();

                // 1. Y축 이동 (중력/점프)
                camera.position.y += velocity.y * delta;
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 0.8, camera.position.z),
                    playerSize
                );
                
                canJump = false;
                for (let box of blockBoxes) {
                    if (playerBox.intersectsBox(box)) {
                        if (velocity.y < 0) { // 착지
                            camera.position.y = box.max.y + 1.6;
                            canJump = true;
                        } else { // 천장 충돌
                            camera.position.y = box.min.y - 0.1;
                        }
                        velocity.y = 0;
                        break;
                    }
                }

                // 2. X축 이동
                const moveX = -velocity.x * delta;
                camera.position.x += moveX;
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 0.8, camera.position.z),
                    playerSize
                );
                for (let box of blockBoxes) {
                    if (playerBox.intersectsBox(box)) {
                        camera.position.x = oldPos.x;
                        velocity.x = 0;
                        break;
                    }
                }

                // 3. Z축 이동
                const moveZ = -velocity.z * delta;
                camera.position.z += moveZ;
                playerBox.setFromCenterAndSize(
                    new THREE.Vector3(camera.position.x, camera.position.y - 0.8, camera.position.z),
                    playerSize
                );
                for (let box of blockBoxes) {
                    if (playerBox.intersectsBox(box)) {
                        camera.position.z = oldPos.z;
                        velocity.z = 0;
                        break;
                    }
                }

                // 맵 밖으로 추락 시 리스폰
                if (camera.position.y < -10) camera.position.set(0, 10, 5);
            }
            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
