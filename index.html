<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Minecraft - 하이라이트 포함 완성본</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 15px; height: 15px;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #ui {
            position: absolute;
            top: 10px; left: 10px; bottom: 10px;
            width: 240px;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 8px;
            overflow-y: auto;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }
        #ui::-webkit-scrollbar { width: 6px; }
        #ui::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        .inv-item {
            margin-top: 4px;
            padding: 6px;
            border-radius: 4px;
            font-size: 0.85em;
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .inv-item:hover { background: rgba(255,255,255,0.1); }
        .active {
            background: rgba(0,255,0,0.15);
            border: 1px solid #00ff00;
            color: #00ff00;
            font-weight: bold;
        }
        .category {
            margin-top: 15px;
            color: #ffeb3b;
            font-weight: bold;
            font-size: 0.9em;
            border-bottom: 1px solid #555;
            padding-bottom: 3px;
        }
        .block-count { color: #aaa; }
        .active .block-count { color: #00ff00; }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div style="font-weight:bold; font-size:1.1em; margin-bottom:5px; text-align:center;">⛏️ 인벤토리</div>
        <div style="font-size:0.8em; color:#aaa; text-align:center; margin-bottom:10px;">[1~0] 키로 선택</div>
        <div id="inventory-list"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        // =========================
        // 블록 데이터
        // =========================
        const BLOCK_DATA = {
            "grass":     { name: "잔디 블록", color: 0x7cfc00, cat: "자연", key: "1" },
            "dirt":      { name: "흙", color: 0x5d4037, cat: "자연", key: "2" },
            "stone":     { name: "돌", color: 0x808080, cat: "자연", key: "3" },
            "deepslate": { name: "심층암", color: 0x3d3d3d, cat: "자연", key: "4" },
            "sand":      { name: "모래", color: 0xd2b48c, cat: "자연", key: "5" },
            "log":       { name: "원목", color: 0x6f4e37, cat: "나무", key: "6" },
            "leaves":    { name: "나뭇잎", color: 0x228b22, cat: "나무", key: "7" },
            "coal":      { name: "석탄 광석", color: 0x2c2c2c, cat: "광석", key: "8" },
            "iron":      { name: "철 광석", color: 0xd8d8d8, cat: "광석", key: "9" },
            "diamond":   { name: "다이아몬드", color: 0x00ffff, cat: "광석", key: "0" }
        };

        let inventory = {};
        let selectedBlockType = "grass";
        Object.keys(BLOCK_DATA).forEach(type => inventory[type] = 20);

        function updateUI() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            let lastCat = '';

            Object.keys(BLOCK_DATA).forEach(type => {
                const data = BLOCK_DATA[type];

                if (data.cat !== lastCat) {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'category';
                    catDiv.innerText = data.cat;
                    list.appendChild(catDiv);
                    lastCat = data.cat;
                }

                const div = document.createElement('div');
                div.className = `inv-item ${selectedBlockType === type ? 'active' : ''}`;
                div.innerHTML = `<span>[${data.key}] ${data.name}</span><span class="block-count">${inventory[type]}</span>`;
                div.onclick = () => {
                    selectedBlockType = type;
                    updateUI();
                };
                list.appendChild(div);
            });
        }
        updateUI();

        // =========================
        // Three.js
        // =========================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        document.addEventListener('click', () => {
            if (!controls.isLocked) controls.lock();
        });

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(10, 30, 15);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 100;
        sun.shadow.camera.left = -50;
        sun.shadow.camera.right = 50;
        sun.shadow.camera.top = 50;
        sun.shadow.camera.bottom = -50;
        scene.add(sun);

        // =========================
        // 블록 관리
        // =========================
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];
        const blockMap = new Map();

        function blockKey(x, y, z) {
            return `${x},${y},${z}`;
        }

        function hasBlockAt(x, y, z) {
            return blockMap.has(blockKey(x, y, z));
        }

        function getBlockAt(x, y, z) {
            return blockMap.get(blockKey(x, y, z)) || null;
        }

        function createBlock(x, y, z, type) {
            x = Math.round(x);
            y = Math.round(y);
            z = Math.round(z);

            if (hasBlockAt(x, y, z)) return null;

            const mat = new THREE.MeshLambertMaterial({ color: BLOCK_DATA[type].color });
            const block = new THREE.Mesh(boxGeo, mat);
            block.position.set(x, y, z);
            block.name = type;
            block.castShadow = true;
            block.receiveShadow = true;

            scene.add(block);
            blocks.push(block);
            blockMap.set(blockKey(x, y, z), block);
            return block;
        }

        function removeBlock(block) {
            const idx = blocks.indexOf(block);
            if (idx !== -1) blocks.splice(idx, 1);
            blockMap.delete(blockKey(block.position.x, block.position.y, block.position.z));
            scene.remove(block);
        }

        // =========================
        // 지형 생성
        // =========================
        const range = 15;
        const groundY = 0;

        for (let x = -range; x <= range; x++) {
            for (let z = -range; z <= range; z++) {
                createBlock(x, groundY, z, 'grass');

                for (let y = -1; y >= -10; y--) {
                    let type = 'stone';

                    if (y >= -2) type = 'dirt';
                    else if (y < -6) type = 'deepslate';

                    const rand = Math.random();
                    if (y < -1 && rand < 0.05) type = 'coal';
                    if (y < -3 && rand < 0.03) type = 'iron';
                    if (y < -7 && rand < 0.01) type = 'diamond';

                    createBlock(x, y, z, type);
                }

                if (
                    x > -range + 1 && x < range - 1 &&
                    z > -range + 1 && z < range - 1 &&
                    Math.random() < 0.03
                ) {
                    growTree(x, groundY + 1, z);
                }
            }
        }

        function growTree(x, y, z) {
            const trunkHeight = 4 + Math.floor(Math.random() * 2);

            for (let i = 0; i < trunkHeight; i++) {
                createBlock(x, y + i, z, 'log');
            }

            const leafBaseY = y + trunkHeight - 2;
            for (let li = 0; li < 3; li++) {
                const radius = 2 - li;
                for (let lx = -radius; lx <= radius; lx++) {
                    for (let lz = -radius; lz <= radius; lz++) {
                        if (li < 2 && Math.abs(lx) === radius && Math.abs(lz) === radius) continue;
                        if (lx === 0 && lz === 0 && li < 2) continue;
                        createBlock(x + lx, leafBaseY + li, z + lz, 'leaves');
                    }
                }
            }
        }

        // =========================
        // 플레이어 충돌/물리
        // =========================
        const PLAYER_WIDTH = 0.6;
        const PLAYER_HALF = PLAYER_WIDTH / 2;
        const PLAYER_HEIGHT = 1.8;
        const PLAYER_EYE_HEIGHT = 1.62;
        const STEP_HEIGHT = 0.6;
        const EPS = 0.001;

        const velocity = new THREE.Vector3(0, 0, 0);
        let canJump = false;

        function getFeetY(pos) {
            return pos.y - PLAYER_EYE_HEIGHT;
        }

        function setFeetY(pos, feetY) {
            pos.y = feetY + PLAYER_EYE_HEIGHT;
        }

        function playerBoxAt(pos) {
            const feetY = getFeetY(pos);
            return {
                minX: pos.x - PLAYER_HALF,
                maxX: pos.x + PLAYER_HALF,
                minY: feetY,
                maxY: feetY + PLAYER_HEIGHT,
                minZ: pos.z - PLAYER_HALF,
                maxZ: pos.z + PLAYER_HALF
            };
        }

        function blockBox(x, y, z) {
            return {
                minX: x - 0.5,
                maxX: x + 0.5,
                minY: y - 0.5,
                maxY: y + 0.5,
                minZ: z - 0.5,
                maxZ: z + 0.5
            };
        }

        function intersects(a, b) {
            return (
                a.minX < b.maxX && a.maxX > b.minX &&
                a.minY < b.maxY && a.maxY > b.minY &&
                a.minZ < b.maxZ && a.maxZ > b.minZ
            );
        }

        function getNearbyBlocksForPos(pos, radiusXZ = 2, radiusY = 3) {
            const out = [];
            const cx = Math.floor(pos.x);
            const cy = Math.floor(getFeetY(pos) + PLAYER_HEIGHT / 2);
            const cz = Math.floor(pos.z);

            for (let x = cx - radiusXZ; x <= cx + radiusXZ; x++) {
                for (let y = cy - radiusY; y <= cy + radiusY; y++) {
                    for (let z = cz - radiusXZ; z <= cz + radiusXZ; z++) {
                        const block = getBlockAt(x, y, z);
                        if (block) out.push(block);
                    }
                }
            }
            return out;
        }

        function collidesAt(pos) {
            const pBox = playerBoxAt(pos);
            const nearby = getNearbyBlocksForPos(pos);

            for (const block of nearby) {
                const bBox = blockBox(block.position.x, block.position.y, block.position.z);
                if (intersects(pBox, bBox)) return true;
            }
            return false;
        }

        function isPlacementInsidePlayer(pos) {
            const pBox = playerBoxAt(camera.position);
            const bBox = blockBox(pos.x, pos.y, pos.z);
            return intersects(pBox, bBox);
        }

        function getFloorY(pos) {
            const pBox = playerBoxAt(pos);
            const nearby = getNearbyBlocksForPos(pos, 2, 4);

            let bestTop = -Infinity;

            for (const block of nearby) {
                const bb = blockBox(block.position.x, block.position.y, block.position.z);

                const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
                const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

                if (!overlapX || !overlapZ) continue;

                if (bb.maxY <= pBox.minY + 0.2) {
                    if (bb.maxY > bestTop) bestTop = bb.maxY;
                }
            }

            return bestTop;
        }

        function getCeilingY(pos) {
            const pBox = playerBoxAt(pos);
            const nearby = getNearbyBlocksForPos(pos, 2, 4);

            let bestBottom = Infinity;

            for (const block of nearby) {
                const bb = blockBox(block.position.x, block.position.y, block.position.z);

                const overlapX = pBox.maxX > bb.minX + EPS && pBox.minX < bb.maxX - EPS;
                const overlapZ = pBox.maxZ > bb.minZ + EPS && pBox.minZ < bb.maxZ - EPS;

                if (!overlapX || !overlapZ) continue;

                if (bb.minY >= pBox.maxY - 0.2) {
                    if (bb.minY < bestBottom) bestBottom = bb.minY;
                }
            }

            return bestBottom;
        }

        function tryMoveAxis(dx, dz) {
            if (dx !== 0) {
                const next = camera.position.clone();
                next.x += dx;

                if (!collidesAt(next)) {
                    camera.position.x = next.x;
                } else {
                    const step = next.clone();
                    step.y += STEP_HEIGHT;
                    if (!collidesAt(step)) {
                        camera.position.x = next.x;
                        camera.position.y = step.y;
                    } else {
                        velocity.x = 0;
                    }
                }
            }

            if (dz !== 0) {
                const next = camera.position.clone();
                next.z += dz;

                if (!collidesAt(next)) {
                    camera.position.z = next.z;
                } else {
                    const step = next.clone();
                    step.y += STEP_HEIGHT;
                    if (!collidesAt(step)) {
                        camera.position.z = next.z;
                        camera.position.y = step.y;
                    } else {
                        velocity.z = 0;
                    }
                }
            }
        }

        function resolveVertical(delta) {
            camera.position.y += velocity.y * delta;

            if (velocity.y > 0) {
                const ceiling = getCeilingY(camera.position);
                if (ceiling < Infinity) {
                    const pBox = playerBoxAt(camera.position);
                    if (pBox.maxY > ceiling) {
                        const newFeet = ceiling - PLAYER_HEIGHT - EPS;
                        setFeetY(camera.position, newFeet);
                        velocity.y = 0;
                    }
                }
            }

            const floorY = getFloorY(camera.position);
            canJump = false;

            if (floorY > -Infinity) {
                const feetY = getFeetY(camera.position);

                if (feetY <= floorY + 0.08 && velocity.y <= 0) {
                    setFeetY(camera.position, floorY);
                    velocity.y = 0;
                    canJump = true;
                }
            }
        }

        // =========================
        // 블록 하이라이트
        // =========================
        const highlightGeo = new THREE.BoxGeometry(1.02, 1.02, 1.02);
        const highlightMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true
        });
        const highlight = new THREE.Mesh(highlightGeo, highlightMat);
        highlight.visible = false;
        scene.add(highlight);

        const raycaster = new THREE.Raycaster();

        function updateBlockHighlight() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 8;

            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                highlight.position.copy(target.position);
                highlight.visible = true;
            } else {
                highlight.visible = false;
            }
        }

        // =========================
        // 상호작용
        // =========================
        window.addEventListener('mousedown', (e) => {
            if (!controls.isLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = 8;

            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const hit = intersects[0];

                if (e.button === 0) {
                    const blockType = hit.object.name;
                    inventory[blockType]++;
                    removeBlock(hit.object);
                    updateUI();
                }

                if (e.button === 2) {
                    if (inventory[selectedBlockType] <= 0) return;
                    if (hit.distance <= 1.5) return;

                    const pos = hit.object.position.clone().add(hit.face.normal);
                    pos.x = Math.round(pos.x);
                    pos.y = Math.round(pos.y);
                    pos.z = Math.round(pos.z);

                    if (hasBlockAt(pos.x, pos.y, pos.z)) return;
                    if (isPlacementInsidePlayer(pos)) return;

                    createBlock(pos.x, pos.y, pos.z, selectedBlockType);
                    inventory[selectedBlockType]--;
                    updateUI();
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // =========================
        // 입력
        // =========================
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;

        document.addEventListener('keydown', (e) => {
            Object.keys(BLOCK_DATA).forEach(type => {
                if (e.key === BLOCK_DATA[type].key) {
                    selectedBlockType = type;
                    updateUI();
                }
            });

            if (e.code === 'KeyW') moveForward = true;
            if (e.code === 'KeyS') moveBackward = true;
            if (e.code === 'KeyA') moveLeft = true;
            if (e.code === 'KeyD') moveRight = true;

            if (e.code === 'Space' && canJump) {
                velocity.y = 8.5;
                canJump = false;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') moveForward = false;
            if (e.code === 'KeyS') moveBackward = false;
            if (e.code === 'KeyA') moveLeft = false;
            if (e.code === 'KeyD') moveRight = false;
        });

        // =========================
        // 애니메이션 루프
        // =========================
        let prevTime = performance.now();

        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        const moveDir = new THREE.Vector3();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.05);

            if (controls.isLocked) {
                velocity.x *= Math.max(0, 1 - 10 * delta);
                velocity.z *= Math.max(0, 1 - 10 * delta);

                velocity.y -= 24 * delta;

                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                moveDir.set(0, 0, 0);
                if (moveForward) moveDir.add(forward);
                if (moveBackward) moveDir.sub(forward);
                if (moveRight) moveDir.add(right);
                if (moveLeft) moveDir.sub(right);

                if (moveDir.lengthSq() > 0) {
                    moveDir.normalize();
                    const accel = 30;
                    velocity.x += moveDir.x * accel * delta;
                    velocity.z += moveDir.z * accel * delta;
                }

                const maxSpeed = 6;
                const horizontalSpeed = Math.hypot(velocity.x, velocity.z);
                if (horizontalSpeed > maxSpeed) {
                    const scale = maxSpeed / horizontalSpeed;
                    velocity.x *= scale;
                    velocity.z *= scale;
                }

                tryMoveAxis(velocity.x * delta, velocity.z * delta);
                resolveVertical(delta);

                if (camera.position.y < -30) {
                    camera.position.set(0, 15, 15);
                    velocity.set(0, 0, 0);
                }
            }

            updateBlockHighlight();

            prevTime = time;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
